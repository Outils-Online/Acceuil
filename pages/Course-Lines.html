<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OVNI CONTROL V9 • Quartz Ink & Coral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* ========== DESIGN SYSTEM • QUARTZ INK & CORAL ========== */
:root {
  --bg-main: #FDFCF0;        /* Fond Jaune Quartz */
  --surface: #FFFFFF;
  --text-main: #0A2472;      /* Texte Bleu Encre */
  --color-primary: #0A2472;  /* Bleu Encre */
  --color-secondary: #006466;/* Émeraude Profond */
  --color-accent: #F46060;   /* Rouge Corail */
  --color-highlight: #FFD972;/* Or Blanc */

  /* Variables utilitaires */
  --border-color: rgba(10,36,114,0.08);
  --glass: rgba(253,252,240,0.7);
  --shadow: 0 8px 32px rgba(0,0,0,0.04);
  --shadow-hover: 0 16px 40px rgba(0,0,0,0.08);
  --radius: 20px;
  --radius-sm: 14px;
  --nav-h: 80px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: #ede8d8; /* léger contraste autour de la coque */
  color: var(--text-main);
  min-height: 100vh;
  padding: 20px 12px calc(var(--nav-h) + 20px);
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* ---------- APP SHELL ---------- */
.app-shell {
  width: 100%;
  max-width: 680px;
  background: var(--bg-main);
  border-radius: 28px;
  padding: 0;
  box-shadow: 0 20px 60px rgba(0,0,0,0.08);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.app-shell::before {
  content: '';
  display: block;
  height: 5px;
  /* Dégradé segmenté signature Quartz */
  background: linear-gradient(to right,
    var(--color-primary) 60%,
    var(--color-secondary) 60% 75%,
    var(--color-accent) 75% 90%,
    var(--color-highlight) 90%);
  flex-shrink: 0;
  border-radius: 5px 5px 0 0;
}

/* ---------- HEADER ---------- */
header {
  background: transparent;
  border-bottom: 1px solid var(--border-color);
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.header-inner { display: flex; align-items: center; justify-content: space-between; }
.icon-btn {
  background: var(--glass);
  backdrop-filter: blur(8px);
  color: var(--text-main);
  border: 1px solid var(--border-color);
  width: 44px; height: 44px; border-radius: 14px; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.3s var(--ease);
}
.icon-btn:hover { background: var(--color-accent); color: white; transform: translateY(-2px); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn-ghost {
  background: var(--glass); backdrop-filter: blur(8px);
  border: 1px solid var(--border-color); color: var(--text-main);
  padding: 8px 16px; border-radius: 30px; font-size: 0.75rem; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: all 0.25s var(--ease); font-family: var(--font-body); letter-spacing: 0.5px;
}
.btn-ghost:hover { border-color: var(--color-accent); color: var(--color-accent); background: rgba(244,96,96,0.08); transform: translateY(-2px); }
.btn-ghost:active { transform: scale(0.96); }
.btn-ghost.accent-ghost {
  border-color: var(--color-highlight); color: var(--color-highlight); background: rgba(255,217,114,0.2);
  position: relative; overflow: hidden;
}
.btn-ghost.accent-ghost::before {
  content: ''; position: absolute; inset: -2px; border-radius: 32px;
  background: conic-gradient(from 0deg, var(--color-highlight), var(--color-primary), var(--color-accent), var(--color-highlight));
  z-index: -1; animation: spin 4s linear infinite; opacity: 0;
  transition: opacity 0.3s;
}
.btn-ghost.accent-ghost:hover::before { opacity: 0.3; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- TAB STRIP ---------- */
.tab-strip {
  display: flex; gap: 4px;
  background: var(--glass); backdrop-filter: blur(8px);
  border: 1px solid var(--border-color); border-radius: 14px; padding: 4px;
}
.tab {
  flex: 1; text-align: center; padding: 10px 6px;
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.8px;
  border-radius: 10px; cursor: pointer; color: var(--color-secondary);
  transition: all 0.2s var(--ease); user-select: none;
  font-family: var(--font-body); text-transform: uppercase;
}
.tab:active { transform: scale(0.96); }
.tab.active {
  background: linear-gradient(145deg, var(--color-primary), #081d56);
  color: white; box-shadow: 0 6px 18px rgba(10,36,114,0.3);
}
.tab .badge {
  display: inline-block; background: rgba(255,255,255,0.3);
  border-radius: 99px; padding: 2px 8px; margin-left: 5px; font-size: 0.65rem;
}

/* ---------- SECTIONS ---------- */
#section-viewport { flex: 1; position: relative; overflow: hidden; }
.section {
  display: none;
  padding: 20px;
  position: relative;
  z-index: 1;
  overflow-y: auto;
}
.section.active {
  display: block;
}

/* ---------- CARDS ---------- */
.card, .catalog-card {
  background: var(--surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 20px; margin-bottom: 18px;
  position: relative; overflow: hidden;
  backdrop-filter: blur(8px);
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
  box-shadow: var(--shadow);
}
.card::before, .catalog-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(145deg, rgba(253,252,240,0.7) 0%, rgba(253,252,240,0.2) 100%);
  z-index: -1;
}
.card:hover, .catalog-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-hover);
}
.card-title {
  font-family: var(--font-display); font-size: 0.75rem; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--color-primary); display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; cursor: pointer; user-select: none;
}
.card-title .title-left { display: flex; align-items: center; gap: 10px; }
.card-title i:first-child { font-size: 0.9rem; color: var(--color-accent); }
.card-title .toggle-icon { transition: transform 0.28s var(--ease); font-size: 0.8rem; color: var(--color-secondary); }
.card.collapsed .card-body { display: none; }
.card.collapsed .toggle-icon { transform: rotate(-90deg); }

/* ---------- FORM ELEMENTS ---------- */
.field-group { margin-bottom: 12px; }
.field-label {
  font-family: var(--font-display); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 1.5px; color: var(--color-secondary); margin-bottom: 6px; text-transform: uppercase;
}
input, select, textarea {
  width: 100%; background: var(--bg-main); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); color: var(--text-main);
  padding: 12px 14px; font-size: 0.9rem; font-family: var(--font-body); outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(244,96,96,0.15);
}
input.error { border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(244,96,96,0.15); }
select { cursor: pointer; }
select option { background: white; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

/* ---------- BUTTONS ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 14px 20px; border: none; border-radius: var(--radius-sm);
  font-family: var(--font-display); font-size: 0.75rem; font-weight: 700;
  letter-spacing: 0.8px; cursor: pointer;
  transition: all 0.25s var(--ease); position: relative; overflow: hidden;
  text-transform: uppercase;
}
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at center, rgba(255,255,255,0.3) 0%, transparent 70%);
  opacity: 0; transition: opacity 0.3s;
}
.btn:active::after { opacity: 1; }
.btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(145deg, var(--color-accent), #d94840); color: white; width: 100%; box-shadow: 0 6px 20px rgba(244,96,96,0.25); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(244,96,96,0.4); }
.btn-success { background: linear-gradient(145deg, var(--color-secondary), #004b4d); color: white; box-shadow: 0 6px 20px rgba(0,100,102,0.25); }
.btn-success:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,100,102,0.4); }
.btn-danger { background: linear-gradient(145deg, var(--color-accent), #c43e3e); color: white; box-shadow: 0 6px 20px rgba(244,96,96,0.25); }
.btn-danger:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(244,96,96,0.4); }
.btn-neutral { background: var(--glass); backdrop-filter: blur(8px); border: 1px solid var(--border-color); color: var(--text-main); width: 100%; }
.btn-neutral:hover { border-color: var(--color-highlight); background: rgba(255,217,114,0.1); transform: translateY(-2px); }

.btn-icon {
  width: 40px; height: 40px; min-width: 40px; min-height: 40px;
  border-radius: 50%; border: none; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.9rem; transition: all 0.25s var(--ease);
  will-change: transform; flex-shrink: 0;
  backdrop-filter: blur(8px);
}
.btn-icon:active { transform: scale(0.88); }
.btn-icon-check { background: rgba(0,100,102,0.15); color: var(--color-secondary); border: 1px solid rgba(0,100,102,0.3); }
.btn-icon-check:hover { background: var(--color-secondary); color: white; transform: translateY(-3px); }
.btn-icon-trash { background: rgba(244,96,96,0.15); color: var(--color-accent); border: 1px solid rgba(244,96,96,0.3); }
.btn-icon-trash:hover { background: var(--color-accent); color: white; transform: translateY(-3px); }
.btn-icon-edit { background: rgba(10,36,114,0.1); color: var(--color-primary); border: 1px solid rgba(10,36,114,0.3); }
.btn-icon-edit:hover { background: var(--color-primary); color: white; transform: translateY(-3px); }
.btn-icon-export { background: rgba(255,217,114,0.25); color: #b39700; border: 1px solid rgba(255,217,114,0.5); }
.btn-icon-export:hover { background: var(--color-highlight); color: #0a2472; transform: translateY(-3px); }
.btn-icon-add {
  background: linear-gradient(145deg, var(--color-accent), #d94840);
  color: white;
  border: 1px solid rgba(244,96,96,0.3);
}
.btn-icon-add:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(244,96,96,0.4); }

/* ---------- SESSION BANNER ---------- */
.session-banner {
  background: linear-gradient(145deg, rgba(253,252,240,0.9), rgba(253,252,240,0.4));
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 14px;
  position: relative; overflow: hidden;
  box-shadow: var(--shadow);
}
.session-banner::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--color-primary), var(--color-highlight));
  border-radius: 4px;
}
.session-banner-top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.session-banner-actions {
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.session-label { font-family: var(--font-display); font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; color: var(--color-secondary); text-transform: uppercase; margin-bottom: 8px; }
.session-text { font-size: 0.82rem; font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--text-main); }
.session-text .tag {
  display: inline-flex; align-items: center; gap: 0;
  background: rgba(10,36,114,0.08); border: 1px solid rgba(10,36,114,0.2);
  color: var(--color-primary); border-radius: 20px;
  font-size: 0.72rem; overflow: hidden; backdrop-filter: blur(8px);
}
.tag-qty-controls {
  display: inline-flex; align-items: center;
  border-right: 1px solid rgba(10,36,114,0.15);
  padding: 0 2px; height: 100%;
}
.tag-label {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px 5px 7px; white-space: nowrap;
}
.tag-label.tag-clickable { cursor: pointer; transition: background 0.15s; }
.tag-label.tag-clickable:hover { background: rgba(10,36,114,0.12); }
.tag-label.tag-active { background: var(--color-primary); color: white; }
/* Boutons +/- dans le tag */
.tag-qty-btn {
  background: none; border: none; cursor: pointer;
  padding: 0; width: 26px; height: 30px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--color-secondary); font-size: 0.62rem;
  transition: color 0.15s; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  /* Cible tactile suffisante */
  min-width: 26px; min-height: 30px;
}
.tag-qty-btn:hover { color: var(--color-accent); background: rgba(244,96,96,0.08); }
.tag-qty-btn:active { background: rgba(244,96,96,0.18); }
/* Input qty dans le tag - override TOTAL du style global */
.tag-qty-input,
.tag-qty-input:focus {
  width: 28px !important;
  min-width: 0 !important;
  text-align: center !important;
  background: transparent !important;
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  outline: none !important;
  font-size: 0.78rem !important;
  font-weight: 800 !important;
  color: var(--color-accent) !important;
  padding: 0 2px !important;
  font-family: var(--font-body) !important;
  -moz-appearance: textfield !important;
}
.tag-qty-input::-webkit-inner-spin-button,
.tag-qty-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.session-tag-qty { font-weight: 800; color: var(--color-accent); padding: 0 2px; }
.tag-clickable { cursor: pointer; }
.session-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
.session-cost { font-size: 0.72rem; color: var(--color-accent); font-weight: 700; display: flex; align-items: center; gap: 4px; }
.btn-reset {
  background: none; border: 1px solid rgba(244,96,96,0.3); color: var(--color-accent);
  font-size: 0.75rem; font-weight: 700; cursor: pointer; padding: 5px 8px;
  border-radius: 8px; opacity: 0.7; transition: all 0.2s; font-family: var(--font-body);
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-reset:hover { opacity: 1; background: rgba(244,96,96,0.1); }
.btn-export-list {
  background: var(--glass); border: 1px solid var(--border-color);
  color: var(--color-secondary); width: 28px; height: 28px; border-radius: 8px;
  cursor: pointer; font-size: 0.78rem; display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.btn-export-list:hover { border-color: var(--color-accent); color: var(--color-accent); background: rgba(244,96,96,0.1); }

/* ---------- SESSION BAR ---------- */
.session-bar {
  background: var(--glass); backdrop-filter: blur(8px);
  border: 1px solid var(--border-color); border-radius: var(--radius-sm);
  padding: 10px 14px; margin-bottom: 18px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.session-bar-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
/* Prod inline row */
.prod-inline-row { display: flex; gap: 8px; align-items: center; }
.prod-select-inline { flex: 1; min-width: 0; }
.prod-qty-inline { width: 58px !important; flex-shrink: 0; text-align: center; padding: 10px 4px !important; }
.prod-add-btn { flex-shrink: 0; padding: 11px 18px !important; width: auto !important; min-width: 0; }
.session-bar-left select {
  flex: 1; min-width: 0; background: rgba(253,252,240,0.8);
  border: 1px solid var(--border-color); border-radius: 20px;
  padding: 8px 24px 8px 12px; font-size: 0.8rem; font-weight: 600;
  color: var(--text-main); cursor: pointer;
}
.session-bar-actions button {
  background: none; border: none; color: var(--color-secondary); cursor: pointer;
  font-size: 0.85rem; width: 34px; height: 34px; border-radius: 10px;
  transition: all 0.2s;
}
.session-bar-actions button:hover { background: rgba(0,0,0,0.05); color: var(--text-main); }

/* ---------- CATEGORY HEADER ---------- */
.category-header {
  font-family: var(--font-display); font-size: 0.65rem; font-weight: 800;
  letter-spacing: 2.2px; text-transform: uppercase;
  color: var(--color-secondary); padding: 16px 4px 8px;
  display: flex; align-items: center; gap: 10px;
}
.category-header::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, rgba(0,100,102,0.3), transparent); }
.cat-done { opacity: 0.4; }
.item-dimmed { opacity: 0.45; }
.cat-done-separator {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.6rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  color: var(--color-secondary); opacity: 0.55; margin: 18px 0 2px;
}
.cat-done-separator::before, .cat-done-separator::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }

/* ---------- LIST ITEMS (one line layout) ---------- */
.list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 14px 16px; margin-bottom: 8px;
  transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
  box-shadow: var(--shadow);
}
.list-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.list-item.done { opacity: 0.5; }
.list-item.done .item-name { text-decoration: line-through; }
.item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item-name {
  font-weight: 600; font-size: 0.92rem;
  color: var(--text-main);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item-meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.item-shop {
  font-size: 0.65rem; color: var(--color-secondary); font-weight: 600;
  display: inline-flex; align-items: center; gap: 3px;
  background: rgba(0,100,102,0.08); border-radius: 6px; padding: 2px 6px;
}
.item-shop i { font-size: 0.6rem; }
.item-price-tag {
  font-size: 0.63rem; color: var(--color-accent); font-weight: 700;
  background: rgba(244,96,96,0.08); border-radius: 6px; padding: 2px 6px;
}
.recipe-dots { display: inline-flex; gap: 4px; align-items: center; }
.field-sub label { font-size: 0.62rem; font-weight: 700; color: var(--color-secondary); letter-spacing: 0.8px; text-transform: uppercase; display: block; margin-bottom: 5px; }
.in-price-label { font-size: 0.62rem; font-weight: 700; color: var(--color-secondary); letter-spacing: 0.8px; text-transform: uppercase; display: block; margin-bottom: 5px; }
.recipe-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(0,0,0,0.1); flex-shrink: 0; }
.list-qty { text-align: center; white-space: nowrap; flex-shrink: 0; }
.qty-big { font-family: var(--font-display); font-size: 1.6rem; color: var(--color-accent); }
.qty-unit { font-size: 0.6rem; color: var(--color-secondary); display: block; margin-top: 2px; }

/* ---------- SORTABLE ---------- */
.sortable-category {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 8px;
  transition: all 0.2s; user-select: none; cursor: grab;
}
.sortable-category:hover { border-color: var(--color-accent); transform: translateY(-2px); }
.sortable-category.drag-over { border-color: var(--color-accent); background: rgba(244,96,96,0.05); }
.drag-handle { color: var(--color-secondary); font-size: 1rem; }

/* ---------- RECIPE CARD ---------- */
.recipe-card {
  background: var(--bg-main); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px;
  transition: all 0.25s var(--ease);
}
.recipe-card.collapsed .recipe-card-grid,
.recipe-card.collapsed .ing-cost-line { display: none; }
.recipe-card.collapsed { padding: 10px 14px; background: rgba(253,252,240,0.6); }
.recipe-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer; }
.recipe-card.collapsed .recipe-card-header { margin-bottom: 0; }
.toggle-icon { width: 24px; font-size: 0.75rem; color: var(--color-secondary); transition: transform 0.28s var(--ease); text-align: center; }
.recipe-card.collapsed .toggle-icon { transform: rotate(-90deg); }
/* ---------- INGREDIENT LIST (remplacement accordéons) ---------- */
.ing-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.ing-pill {
  display: flex; align-items: center; gap: 10px;
  background: var(--glass); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); padding: 10px 14px;
  cursor: pointer; transition: all 0.18s;
}
.ing-pill:hover { border-color: var(--color-primary); background: rgba(10,36,114,0.05); transform: translateX(3px); }
.ing-pill-icon { width: 30px; height: 30px; border-radius: 9px; background: rgba(10,36,114,0.1); display: flex; align-items: center; justify-content: center; color: var(--color-primary); font-size: 0.75rem; flex-shrink: 0; }
.ing-pill-body { flex: 1; min-width: 0; }
.ing-pill-name { font-weight: 700; font-size: 0.88rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ing-pill-meta { font-size: 0.68rem; color: var(--color-secondary); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
.ing-pill-cost { font-size: 0.72rem; font-weight: 700; color: var(--color-accent); white-space: nowrap; }
.ing-pill-del { width: 28px; height: 28px; border-radius: 8px; background: rgba(244,96,96,0.1); border: 1px solid rgba(244,96,96,0.2); color: var(--color-accent); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0; transition: all 0.15s; }
.ing-pill-del:hover { background: var(--color-accent); color: white; }

/* ---------- MODAL INGRÉDIENT ---------- */
.ing-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ing-modal-row3 { display: grid; grid-template-columns: 1.2fr 1.2fr 1.6fr; gap: 8px; }
.ing-modal-full { margin-bottom: 10px; }
.ing-modal-field label { font-size: 0.6rem; font-weight: 800; color: var(--color-secondary); letter-spacing: 0.8px; text-transform: uppercase; display: block; margin-bottom: 5px; }
.ing-modal-field label i { margin-right: 4px; }
/* Coût estimé en sous-texte sous le prix */
.ing-price-subtext {
  font-size: 0.65rem; font-weight: 700;
  color: var(--color-accent);
  margin-top: 4px; min-height: 1em;
  padding-left: 2px;
  transition: all 0.2s;
}
/* Supprimé : ancienne box coût estimé */
.ing-modal-cost-preview { display: none; }

/* Scan barcode */
.barcode-section { margin-bottom: 14px; }
.barcode-btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
/* Icône scan discrète à côté du champ nom */
.btn-scan-icon {
  flex-shrink: 0; width: 42px; height: 42px;
  background: rgba(10,36,114,0.06); border: 1.5px solid rgba(10,36,114,0.2);
  color: var(--color-primary); border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 1rem;
  transition: all 0.2s;
}
.btn-scan-icon:hover { background: var(--color-primary); color: white; border-color: var(--color-primary); }
.btn-scan-icon.scanning { background: var(--color-primary); color: white; border-color: var(--color-primary); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
#barcode-video-container { position: relative; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 8px; }
#barcode-video-container video { width: 100%; display: block; max-height: 200px; object-fit: cover; }
.barcode-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 60%; height: 40%; border: 2px solid rgba(255,255,0,0.8); border-radius: 6px; pointer-events: none; }
.barcode-crosshair::before, .barcode-crosshair::after { content:''; position: absolute; }
#barcode-manual-row { display: flex; gap: 8px; align-items: center; }
#barcode-manual-row input { flex: 1; min-width: 0; font-size: 0.9rem; }
#barcode-manual-row .btn { flex-shrink: 0; width: 44px; height: 42px; padding: 0; display: flex; align-items: center; justify-content: center; }
.off-result { font-size: 0.72rem; padding: 8px 12px; border-radius: 8px; background: rgba(10,36,114,0.06); border: 1px solid rgba(10,36,114,0.15); color: var(--color-secondary); margin-bottom: 8px; display: none; }
.off-result.found { display: block; color: var(--color-primary); background: rgba(10,36,114,0.08); }
.ing-cost-line { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.ing-cost-preview { font-size: 0.75rem; color: var(--color-accent); font-weight: 700; }
.price-input-wrapper { position: relative; display: flex; align-items: center; gap: 4px; }
.price-input-wrapper input { flex: 1; padding-right: 10px; }
.btn-lot {
  flex-shrink: 0; width: 32px; height: 36px;
  background: rgba(10,36,114,0.08); border: 1px solid rgba(10,36,114,0.2);
  color: var(--color-primary); border-radius: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
  transition: all 0.2s;
}
.btn-lot:hover { background: var(--color-primary); color: white; }
.price-label { font-size: 0.6rem; color: var(--color-secondary); font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; margin-top: 4px; display: block; }
/* Filtre courses */
.list-filter-bar {
  display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto;
  padding-bottom: 4px; scrollbar-width: none;
}
.list-filter-bar::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: 99px; font-size: 0.7rem; font-weight: 700;
  border: 1px solid var(--border-color); background: var(--glass);
  color: var(--color-secondary); cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.filter-chip.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
.filter-chip i { font-size: 0.75rem; }
.btn-del-row {
  width: 32px; height: 32px; flex-shrink: 0;
  background: rgba(244,96,96,0.15); border: 1px solid rgba(244,96,96,0.3);
  color: var(--color-accent); border-radius: 10px;
  cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.btn-del-row:hover { background: var(--color-accent); color: white; }

/* ---------- AUTOCOMPLETE ---------- */
.ac-wrapper { position: relative; }
.ac-box {
  position: absolute; top: calc(100% + 5px); left: 0; right: 0;
  background: white; border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); z-index: 500; display: none; overflow: hidden;
  box-shadow: var(--shadow);
}
.ac-item { padding: 12px 15px; font-size: 0.85rem; cursor: pointer; transition: background 0.15s; color: var(--text-main); }
.ac-item:hover { background: rgba(244,96,96,0.1); }
.ac-item span { color: var(--color-secondary); font-size: 0.7rem; margin-left: 8px; }

/* ---------- CATALOG CARD ---------- */
.catalog-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: nowrap;
  gap: 12px;
  padding: 15px 20px;
}
.catalog-name { font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: var(--color-primary); }
.catalog-meta { font-size: 0.72rem; color: var(--color-secondary); margin-top: 4px; }
.catalog-cost { font-size: 0.78rem; color: var(--color-accent); font-weight: 700; margin-top: 6px; display: inline-flex; align-items: center; gap: 5px; }
.catalog-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }

/* ---------- SEARCH ---------- */
.search-field { position: relative; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.search-field i:first-child { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-secondary); font-size: 0.9rem; pointer-events: none; }
.search-field input { padding-left: 40px; flex: 1; }
.import-icon-btn {
  background: var(--glass); backdrop-filter: blur(8px);
  border: 1px solid var(--border-color); border-radius: 40px;
  width: 46px; height: 42px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; color: var(--color-secondary);
}
.import-icon-btn:hover { border-color: var(--color-accent); color: var(--color-accent); background: rgba(244,96,96,0.1); }

/* ---------- COST PILL ---------- */
.cost-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,217,114,0.25); border: 1px solid rgba(255,217,114,0.4);
  border-radius: 99px; padding: 5px 14px; font-size: 0.75rem; font-weight: 700; color: #b39700;
  backdrop-filter: blur(4px);
}

/* ---------- TOAST ---------- */
#toast-container {
  position: fixed; bottom: calc(var(--nav-h) + 20px); left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.toast {
  background: rgba(10,36,114,0.95); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 99px; padding: 12px 22px; font-size: 0.82rem; font-weight: 600;
  color: white; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2); backdrop-filter: blur(12px);
  animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.toast.hide { opacity: 0; transition: opacity 0.3s; }
@keyframes toastIn { from { opacity:0; transform:translateY(10px) scale(0.95); } to { opacity:1; transform:none; } }
.toast.success { border-color: var(--color-secondary); color: var(--color-secondary); }
.toast.error   { border-color: var(--color-accent); color: var(--color-accent); }
.toast.info    { border-color: var(--color-highlight); color: var(--color-highlight); }

/* ---------- BOTTOM NAV (fixed, full width, high z-index) ---------- */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  z-index: 9899;
  background: rgba(253,252,240,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-color);
  display: flex;
  height: var(--nav-h);
  padding-bottom: env(safe-area-inset-bottom, 8px);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--color-secondary); cursor: pointer;
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.7px; gap: 6px;
  transition: color 0.2s var(--ease); position: relative; user-select: none;
  padding: 12px 0;
}
.nav-item i { font-size: 1.3rem; transition: transform 0.25s var(--ease), color 0.2s; }
.nav-item:active i { transform: scale(0.88); }
.nav-item.active { color: var(--color-accent); }
.nav-item.active i { transform: translateY(-3px) scale(1.1); }
.nav-item::before {
  content: ''; position: absolute; top: 0; left: 25%; right: 25%; height: 3px;
  border-radius: 0 0 4px 4px; background: var(--color-accent);
  transform: scaleX(0); transition: transform 0.3s var(--ease);
}
.nav-item.active::before { transform: scaleX(1); }
.nav-badge {
  position: absolute; top: 6px; right: calc(25% - 8px);
  background: var(--color-accent); color: white; font-size: 0.55rem; font-weight: 900;
  border-radius: 99px; padding: 2px 6px; min-width: 18px; text-align: center;
  box-shadow: 0 2px 8px rgba(244,96,96,0.4);
}

/* ---------- EMPTY STATES ---------- */
.empty { text-align: center; padding: 60px 20px; color: var(--color-secondary); }
.empty i { font-size: 2.8rem; opacity: 0.2; margin-bottom: 16px; display: block; color: var(--color-primary); }
.empty p { font-size: 0.9rem; }

/* ---------- MODAL ---------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
  display: flex; align-items: flex-end;
}
.modal-sheet {
  position: fixed;
  bottom: calc(var(--nav-h) + 12px);
  left: 12px; right: 12px;
  z-index: 10000;
  background: var(--bg-main);
  border-radius: 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  padding: 20px;
  overflow: hidden;
}
.modal-sheet-inner {
  overflow-y: auto;
  max-height: 80vh;
  padding-bottom: 8px;
}
.modal-handle { width: 40px; height: 5px; background: var(--border-color); border-radius: 3px; margin: 0 auto 18px; }
.modal-title { font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 8px; color: var(--color-primary); }
.modal-sub { font-size: 0.8rem; color: var(--color-secondary); margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.import-recipe-item {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--border-color);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
  transition: border-color 0.15s;
}
.import-recipe-item:has(.import-check:checked) { border-color: var(--color-accent); background: rgba(244,96,96,0.05); }
.import-recipe-item .info { flex: 1; }
.import-recipe-item .name { font-weight: 700; font-size: 0.95rem; color: var(--text-main); }
.import-recipe-item .meta { font-size: 0.72rem; color: var(--color-secondary); margin-top: 4px; }
.badge-exists, .badge-new { font-size: 0.65rem; font-weight: 700; padding: 3px 9px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; }
.badge-exists { background: rgba(244,96,96,0.1); color: var(--color-accent); border: 1px solid rgba(244,96,96,0.3); }
.badge-new { background: rgba(0,100,102,0.1); color: var(--color-secondary); border: 1px solid rgba(0,100,102,0.3); }
.import-check { width: 22px; height: 22px; accent-color: var(--color-accent); }

/* ---------- RESPONSIVE ---------- */
@media (min-width: 641px) {
  .modal-sheet {
    max-width: 480px;
    margin: auto;
    border-radius: 20px !important;
    max-height: 85vh;
    overflow: hidden;
  }
  .modal-sheet-inner {
    max-height: calc(85vh - 90px);
  }
  .modal-overlay {
    align-items: center;
    justify-content: center;
  }
}
@media (max-width: 640px) {
  :root { --nav-h: 64px; }
  body { padding: 12px 8px calc(var(--nav-h) + 16px); }
  .section { padding: 16px; }
  .card { padding: 16px; }
  .btn { min-height: 50px; padding: 14px 16px; font-size: 0.9rem; }
  .btn-icon { width: 44px; height: 44px; min-width: 44px; min-height: 44px; }
  input, select, textarea { font-size: 16px; padding: 13px 14px; }
  .list-item { padding: 12px; }
  .qty-big { font-size: 1.5rem; }
  .catalog-card { padding: 12px 14px; }
  .catalog-name { font-size: 0.9rem; }
}
@media (max-width: 480px) {
  .list-item { padding: 10px; }
  .qty-big { font-size: 1.3rem; }
  .item-name { font-size: 0.85rem; }
  .btn-icon { width: 40px; height: 40px; min-width: 40px; min-height: 40px; }
}
@media (max-width: 360px) {
  .list-item { padding: 8px; }
  .qty-big { font-size: 1.1rem; }
}
</style>
</head>
<body>
<div id="toast-container"></div>
<div class="app-shell">
  <header>
    <div class="header-inner">
      <button class="icon-btn" onclick="window.parent.closeIframe('iframe_course_lines')" title="Fermer">✕</button>
      <button class="icon-btn" onclick="undoList()" id="btn-undo" title="Annuler" style="opacity:0.3;pointer-events:none;"><i class="fa-solid fa-rotate-left"></i></button>
      <button class="icon-btn" onclick="redoList()" id="btn-redo" title="Rétablir" style="opacity:0.3;pointer-events:none;"><i class="fa-solid fa-rotate-right"></i></button>
      <div class="header-actions">
        <button class="btn-ghost" onclick="showCopyModal()"><i class="fa-solid fa-copy"></i> <span>COPIER</span></button>
      </div>
    </div>
    <div id="shopping-tabs" class="tab-strip" style="display:none;">
      <div class="tab active" id="tab-todo" onclick="setMode('todo')">À ACHETER <span class="badge" id="cnt-todo">0</span></div>
      <div class="tab" id="tab-done" onclick="setMode('done')">PANIER <span class="badge" id="cnt-done">0</span></div>
      <div class="tab" id="tab-sort" onclick="setMode('sort')"><i class="fa-solid fa-arrows-up-down"></i> RAYONS</div>
    </div>
  </header>

  <div id="section-viewport">
    <div id="sec-prod" class="section active">
      <div class="session-bar" id="session-bar-prod">
        <div class="session-bar-left">
          <i class="fa-solid fa-list-check" style="color:var(--color-accent);font-size:0.9rem;"></i>
          <select id="session-select-prod"></select>
        </div>
        <div class="session-bar-actions">
          <button onclick="createNewSession()" title="Nouvelle liste"><i class="fa-solid fa-plus"></i></button>
          <button onclick="renameCurrentSession()" title="Renommer"><i class="fa-solid fa-pen"></i></button>
          <button class="danger-btn" onclick="deleteCurrentSession()" title="Supprimer"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">
          <div class="title-left"><i class="fa-solid fa-bolt"></i> Lancer une Production</div>
        </div>
        <div class="card-body">
          <div class="prod-inline-row">
            <select id="prod-select" class="prod-select-inline"></select>
            <input type="number" id="prod-qty" value="1" min="1" class="prod-qty-inline">
            <button class="btn btn-success prod-add-btn" onclick="addProduction()"><i class="fa-solid fa-cart-plus"></i></button>
          </div>
          <div id="prod-cost-preview" style="display:none;margin-top:8px;">
            <span class="cost-pill"><i class="fa-solid fa-euro-sign"></i> Coût estimé : <strong id="prod-cost-val">0.00 €</strong></span>
          </div>
        </div>
      </div>
      <div class="card collapsed" id="card-single">
        <div class="card-title" onclick="toggleCard(this)">
          <div class="title-left"><i class="fa-solid fa-pen"></i> Article Hors-Fiche</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="card-body">
          <p style="font-size:0.82rem;color:var(--color-secondary);margin-bottom:14px;">Ajoute un article directement à la liste, avec scan code-barres ou saisie manuelle.</p>
          <button class="btn btn-neutral" onclick="openSingleModal()"><i class="fa-solid fa-plus"></i> Ajouter un article</button>
        </div>
      </div>
    </div>

    <div id="sec-list" class="section">
      <div class="session-banner">
        <!-- Ligne 1 : label + actions compactes -->
        <div class="session-banner-top">
          <span class="session-label" style="margin:0;"><i class="fa-solid fa-list-check" style="margin-right:5px;color:var(--color-accent);"></i><span id="active-session-name"></span></span>
          <div class="session-banner-actions">
            <div class="session-cost" id="session-cost-badge" style="display:none;"><i class="fa-solid fa-coins"></i> <span id="session-cost-total"></span></div>
            <button class="btn-export-list" onclick="shareListURL()" title="Partager"><i class="fa-solid fa-share-nodes"></i></button>
            <button class="btn-export-list" onclick="exportListJSON()" title="Exporter"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
            <button class="btn-export-list" onclick="document.getElementById('import-list-file').click()" title="Importer"><i class="fa-solid fa-download"></i></button>
            <input type="file" id="import-list-file" accept=".json" style="display:none" onchange="importListJSON(this)">
            <button class="btn-reset" onclick="resetSession()"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>
        <!-- Ligne 2 : tags recettes cliquables (collapsibles) -->
        <div id="session-text" class="session-text" style="margin-top:8px;">—</div>
        <!-- Ligne 3 : chips magasins (si renseignés) -->
        <div id="session-shop-filters" style="display:none; margin-top:8px; flex-wrap:wrap; gap:6px;"></div>
        <!-- Ligne 4 : filtre actif -->
        <div id="active-filter-bar" style="display:none; margin-top:6px; padding-top:6px; border-top:1px solid var(--border-color);"></div>
      </div>
      <div id="list-display"></div>
      <div id="list-filter-bar" class="list-filter-bar" style="display:none;"></div>
      <div id="list-filtered-display"></div>
    </div>

    <div id="sec-labo" class="section">
      <div class="card collapsed" id="card-create-recipe">
        <div class="card-title" onclick="toggleCard(this)">
          <div class="title-left"><i class="fa-solid fa-flask"></i> <span id="labo-title">Créer une Fiche</span></div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="card-body">
          <div class="field-group">
            <div class="field-label">Nom de la recette</div>
            <input type="text" id="recipe-name" placeholder="ex: Burger Signature">
          </div>
          <div id="recipe-rows" class="ing-list"></div>
          <div id="recipe-total-cost" class="cost-pill" style="display:none; margin-bottom:14px;"><i class="fa-solid fa-coins"></i> </div>
          <div class="row" style="margin-bottom:14px;">
            <button class="btn btn-neutral" onclick="openIngModal()"><i class="fa-solid fa-plus"></i> Ajouter un ingrédient</button>
          </div>
          <div class="row">
            <button class="btn btn-success" onclick="saveRecipe()"><i class="fa-solid fa-floppy-disk"></i> ENREGISTRER</button>
            <button class="btn btn-danger" id="btn-cancel" style="display:none;" onclick="cancelEdit()">ANNULER</button>
          </div>
        </div>
      </div>
      <div class="search-field">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="labo-search" placeholder="Rechercher une fiche…" oninput="renderLabo()">
        <div class="import-icon-btn" onclick="document.getElementById('discreet-import').click()" title="Importer des fiches JSON">
          <i class="fa-solid fa-file-import"></i>
        </div>
        <input type="file" id="discreet-import" accept=".json" style="display:none" onchange="handleImportFile(this)">
      </div>
      <div id="catalog-display"></div>
    </div>
  </div>
</div><!-- /app-shell -->

<nav class="bottom-nav">
  <div class="nav-item active" id="nav-prod" onclick="switchView('prod')">
    <i class="fa-solid fa-rocket"></i><span>PROD</span>
  </div>
  <div class="nav-item" id="nav-list" onclick="switchView('list')">
    <i class="fa-solid fa-cart-shopping"></i><span>COURSES</span>
    <span id="nav-badge" class="nav-badge" style="display:none;"></span>
  </div>
  <div class="nav-item" id="nav-labo" onclick="switchView('labo')">
    <i class="fa-solid fa-book-open"></i><span>LABO</span>
  </div>
</nav>

<script>
const DEFAULT_CATEGORIES = [
  'Fruits & Légumes','Viandes','Poissons','Produits frais',
  'Épicerie salée','Épicerie sucrée','Liquides','Surgelés','Autre'
];

let state = {
  view: 'prod',
  listMode: 'todo',
  editingId: null,
  activeFilter: null,
  sessions: {},
  currentSessionId: null,
  recipes: [], 
  categoryOrder: [...DEFAULT_CATEGORIES]
};

function toggleCard(titleElement) {
  const card = titleElement.closest('.card');
  if (card) card.classList.toggle('collapsed');
}

function currentSession() {
  if (!state.currentSessionId || !state.sessions[state.currentSessionId]) {
    const id = 'default_' + Date.now();
    state.sessions[id] = { id, name: 'Liste principale', recipes: {}, singles: 0, totalCost: 0, list: [] };
    state.currentSessionId = id;
  }
  return state.sessions[state.currentSessionId];
}

function createNewSession() {
  let name = prompt('Nom de la nouvelle liste :', 'Courses ' + (Object.keys(state.sessions).length+1));
  if (!name) return;
  const id = 'sess_' + Date.now();
  state.sessions[id] = { id, name, recipes: {}, singles: 0, totalCost: 0, list: [] };
  state.currentSessionId = id;
  saveState(); renderSessionSelector(); render();
  toast(`Liste "${name}" créée`);
}

function renameCurrentSession() {
  const sess = currentSession();
  const newName = prompt('Nouveau nom :', sess.name);
  if (newName && newName.trim()) {
    sess.name = newName.trim();
    saveState(); renderSessionSelector(); render();
    toast('Liste renommée');
  }
}

function deleteCurrentSession() {
  if (Object.keys(state.sessions).length <= 1) { toast('Impossible de supprimer la seule liste restante', 'error'); return; }
  const sess = currentSession();
  if (confirm(`Supprimer définitivement la liste "${sess.name}" ?`)) {
    delete state.sessions[state.currentSessionId];
    state.currentSessionId = Object.keys(state.sessions)[0];
    saveState(); renderSessionSelector(); render();
    toast(`Liste supprimée`);
  }
}

function selectSession(id) {
  if (state.sessions[id]) { state.currentSessionId = id; saveState(); render(); }
}

function renderSessionSelector() {
  const selProd = document.getElementById('session-select-prod');
  const activeNameSpan = document.getElementById('active-session-name');
  if (selProd) {
    const curId = state.currentSessionId;
    selProd.innerHTML = Object.values(state.sessions).map(s => `<option value="${s.id}" ${s.id === curId ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('');
    selProd.onchange = (e) => selectSession(e.target.value);
  }
  if (activeNameSpan && currentSession()) activeNameSpan.innerText = currentSession().name;
}

function loadState() {
  try {
    const saved = localStorage.getItem('ovni_v9');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
      if (!state.categoryOrder || !state.categoryOrder.length) state.categoryOrder = [...DEFAULT_CATEGORIES];
      if (!state.sessions || Object.keys(state.sessions).length === 0) {
        const oldList = state.list || [];
        const oldSession = state.session || { recipes: {}, singles: 0, totalCost: 0 };
        const newId = 'sess_' + Date.now();
        state.sessions = { [newId]: { id: newId, name: 'Liste principale', recipes: oldSession.recipes, singles: oldSession.singles, totalCost: oldSession.totalCost, list: oldList } };
        state.currentSessionId = newId;
        delete state.list; delete state.session;
      }
      if (!state.currentSessionId || !state.sessions[state.currentSessionId]) state.currentSessionId = Object.keys(state.sessions)[0];
    } else {
      const defaultId = 'sess_default';
      state.sessions = { [defaultId]: { id: defaultId, name: 'Liste principale', recipes: {}, singles: 0, totalCost: 0, list: [] } };
      state.currentSessionId = defaultId;
    }
  } catch(e) { console.warn('Load error', e); }
}

function saveState() {
  const toStore = { view: state.view, listMode: state.listMode, editingId: state.editingId, activeFilter: state.activeFilter, sessions: state.sessions, currentSessionId: state.currentSessionId, recipes: state.recipes, categoryOrder: state.categoryOrder };
  try { localStorage.setItem('ovni_v9', JSON.stringify(toStore)); } catch(e) {}
  render();
}

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success: 'fa-check-circle', error: 'fa-triangle-exclamation', info: 'fa-info-circle' };
  el.innerHTML = `<i class="fa-solid ${icons[type] || icons.success}"></i>${msg}`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 400); }, 2200);
}

function switchView(v) {
  if (v === state.view) return;
  const oldSec = document.getElementById('sec-' + state.view);
  const newSec = document.getElementById('sec-' + v);
  oldSec.classList.remove('active');
  newSec.classList.add('active');
  state.view = v;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-' + v).classList.add('active');
  document.getElementById('shopping-tabs').style.display = v === 'list' ? 'flex' : 'none';
  render();
}

function setMode(m) {
  state.listMode = m;
  ['todo','done','sort'].forEach(id => { const el = document.getElementById('tab-' + id); if (el) el.classList.toggle('active', id === m); });
  render();
}

function addProduction() {
  const name = document.getElementById('prod-select').value;
  const qty = parseInt(document.getElementById('prod-qty').value);
  if (!name) return toast('Sélectionne une fiche', 'error');
  if (!qty || qty <= 0) return toast('Quantité invalide', 'error');
  const recipe = state.recipes.find(r => r.name === name);
  if (!recipe) return;
  const sess = currentSession();
  pushUndoState();
  sess.recipes[name] = (sess.recipes[name] || 0) + qty;
  const batchCost = recipeUnitCost(recipe) * qty;
  recipe.ingredients.forEach(ing => {
    const exist = sess.list.find(i => i.name === ing.name && i.unit === ing.unit);
    if (exist) { exist.qty = parseFloat((exist.qty + ing.qty * qty).toFixed(4)); exist.done = false; }
    else sess.list.push({ ...ing, qty: parseFloat((ing.qty * qty).toFixed(4)), done: false });
  });
  sess.totalCost = (sess.totalCost || 0) + batchCost;
  saveState();
  toast(`${qty}× ${name} ajouté à "${sess.name}" ✓`);
}

function openSingleModal() {
  window._singleMode = true;
  openIngModal(null);
  requestAnimationFrame(() => {
    const title = document.querySelector('#ing-modal .modal-title');
    if (title) title.innerHTML = `<i class="fa-solid fa-cart-plus" style="color:var(--color-primary);margin-right:8px;"></i>Article hors-fiche`;
    const btn = document.querySelector('#ing-modal .btn-success');
    if (btn) btn.innerHTML = `<i class="fa-solid fa-cart-plus"></i> Ajouter à la liste`;
  });
}

function addSingleFromModal(name, qty, unit, cat, price, shop) {
  const sess = currentSession();
  pushUndoState();
  const exist = sess.list.find(i => i.name.toLowerCase() === name.toLowerCase() && i.unit === unit);
  if (exist) { exist.qty = parseFloat((exist.qty + qty).toFixed(4)); exist.done = false; }
  else sess.list.push({ name, qty, unit, cat, price: price || 0, shop: shop || '', done: false });
  // sess.singles est recalculé dynamiquement dans renderListView
  saveState();
  toast(`${name} ajouté à la liste ✓`);
}

function addSingle() { /* legacy no-op */ }

function resetSession() {
  const sess = currentSession();
  if (!confirm(`Vider toute la liste "${sess.name}" ?`)) return;
  pushUndoState();
  sess.list = []; sess.recipes = {}; sess.singles = 0; sess.totalCost = 0;
  saveState(); toast('Liste réinitialisée', 'info');
}

function toggleItem(name, unit) {
  const sess = currentSession();
  const item = sess.list.find(i => i.name === name && i.unit === unit);
  if (item) { pushUndoState(); item.done = !item.done; saveState(); }
}

function delItem(name, unit) {
  const sess = currentSession();
  pushUndoState();
  sess.list = sess.list.filter(i => !(i.name === name && i.unit === unit));
  saveState(); toast('Article supprimé', 'info');
}

function toggleRow(header) { header.closest('.recipe-card').classList.toggle('collapsed'); }

const UNIT_WEIGHT = ['kg','g'];
const UNIT_VOLUME = ['L','cl','ml'];
const UNIT_PIECE  = ['pièce','paquet','boîte','sachet','botte','tranche','portion','dose'];

function getPriceMode(unit) {
  if (UNIT_WEIGHT.includes(unit)) return { label: '€/kg', mode: 'weight' };
  if (UNIT_VOLUME.includes(unit)) return { label: '€/L',  mode: 'volume' };
  // Pour paquet, le label est plus explicite
  if (unit === 'paquet') return { label: '€', mode: 'piece', hint: '€/paquet' };
  return { label: '€', mode: 'piece' };
}

// Convertit le prix saisi (au kg/L) en coût réel pour la quantité
function computeIngCost(qty, unit, priceEntry) {
  if (!priceEntry || !qty) return 0;
  if (unit === 'g')  return (qty / 1000) * priceEntry;
  if (unit === 'cl') return (qty / 100)  * priceEntry;
  if (unit === 'ml') return (qty / 1000) * priceEntry;
  // kg, L, pièce... : prix direct × quantité
  return qty * priceEntry;
}

// ── Ingrédients en mémoire (remplace les .recipe-card DOM) ──────────────
let _ings = []; // [{id, name, qty, unit, cat, price, shop}]

function renderIngList() {
  const container = document.getElementById('recipe-rows');
  if (!_ings.length) {
    container.innerHTML = `<div style="text-align:center;padding:20px 0;color:var(--color-secondary);font-size:0.8rem;"><i class="fa-solid fa-carrot" style="font-size:1.4rem;display:block;margin-bottom:8px;opacity:0.3;"></i>Aucun ingrédient</div>`;
    updateRecipeTotalCost(); return;
  }
  container.innerHTML = _ings.map((ing, idx) => {
    const cost = computeIngCost(ing.qty, ing.unit, ing.price || 0);
    const pm = getPriceMode(ing.unit);
    const costStr = cost > 0 ? `${cost.toFixed(2)} €` : '';
    const priceStr = ing.price > 0 ? `${ing.price.toFixed(2)} ${pm.label}` : '';
    const shopStr = ing.shop ? `<i class="fa-solid fa-store"></i> ${escapeHtml(ing.shop)}` : '';
    const metas = [ing.qty + ' ' + ing.unit, ing.cat, priceStr, shopStr].filter(Boolean);
    return `<div class="ing-pill" onclick="openIngModal(${idx})">
      <div class="ing-pill-icon"><i class="fa-solid fa-leaf"></i></div>
      <div class="ing-pill-body">
        <div class="ing-pill-name">${escapeHtml(ing.name)}</div>
        <div class="ing-pill-meta">${metas.join(' · ')}</div>
      </div>
      ${costStr ? `<div class="ing-pill-cost">${costStr}</div>` : ''}
      <button class="ing-pill-del" onclick="event.stopPropagation(); deleteIng(${idx})"><i class="fa-solid fa-xmark"></i></button>
    </div>`;
  }).join('');
  updateRecipeTotalCost();
}

function deleteIng(idx) {
  _ings.splice(idx, 1);
  renderIngList();
}

// ── Modal ingrédient ─────────────────────────────────────────────────────
function openIngModal(editIdx = null) {
  const ing = editIdx !== null ? _ings[editIdx] : {};
  const units = ['kg','g','L','cl','ml','pièce','paquet','boîte','sachet','botte','tranche','portion','dose'];
  const cats  = DEFAULT_CATEGORIES;
  const unitOpts = units.map(u => `<option value="${u}" ${(ing.unit||'kg')===u?'selected':''}>${u}</option>`).join('');
  const catOpts  = cats.map(c => `<option value="${c}" ${(ing.cat||cats[0])===c?'selected':''}>${c}</option>`).join('');
  const pm = getPriceMode(ing.unit || 'kg');
  const isPiece = pm.mode === 'piece';

  const modal = document.createElement('div');
  modal.className = 'modal-overlay'; modal.id = 'ing-modal';
  modal.innerHTML = `<div class="modal-sheet" style="padding:20px;max-height:92vh;overflow-y:auto;">
    <div class="modal-handle"></div>
    <div class="modal-title" style="margin-bottom:16px;">
      <i class="fa-solid fa-${editIdx!==null?'pen':'plus'}" style="color:var(--color-primary);margin-right:8px;"></i>
      ${editIdx !== null ? 'Modifier l\'ingrédient' : 'Nouvel ingrédient'}
    </div>

    <!-- Nom + icône scan discrète -->
    <div class="ing-modal-full ing-modal-field">
      <label><i class="fa-solid fa-tag"></i> Nom de l'ingrédient</label>
      <div style="display:flex;gap:8px;align-items:flex-start;">
        <div class="ac-wrapper" style="flex:1;">
          <input type="text" id="im-name" placeholder="ex: Farine T65" value="${escapeHtml(ing.name||'')}"
            oninput="handleIngModalAC(this)" onblur="prefillIngModal(this)">
          <div class="ac-box"></div>
        </div>
        <button class="btn-scan-icon" id="btn-cam-scan" onclick="startBarcodeCamera()" title="Scanner un code-barres"><i class="fa-solid fa-barcode"></i></button>
        <button class="btn-scan-icon" onclick="toggleManualBarcode()" title="Saisie EAN manuelle"><i class="fa-solid fa-keyboard"></i></button>
      </div>
      <div id="barcode-video-container" style="display:none;margin-top:8px;">
        <video id="barcode-video" autoplay playsinline muted></video>
        <div class="barcode-crosshair"></div>
      </div>
      <div id="barcode-manual-row" style="display:none;margin-top:6px;">
        <input type="text" id="barcode-manual-input" placeholder="Code EAN (ex: 3017620422003)" inputmode="numeric">
        <button class="btn btn-neutral" style="padding:0 14px;flex-shrink:0;" onclick="lookupBarcode(document.getElementById('barcode-manual-input').value)">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
      <div class="off-result" id="off-result" style="margin-top:6px;"></div>
    </div>

    <!-- Qté + Unité + Prix sur une ligne -->
    <div class="ing-modal-row3">
      <div class="ing-modal-field">
        <label><i class="fa-solid fa-scale-balanced"></i> Qté</label>
        <input type="number" id="im-qty" placeholder="0" step="0.001" min="0" value="${ing.qty||''}" oninput="updateIngModalCost()">
      </div>
      <div class="ing-modal-field">
        <label><i class="fa-solid fa-ruler"></i> Unité</label>
        <select id="im-unit" onchange="onIngModalUnitChange(this)">${unitOpts}</select>
      </div>
      <div class="ing-modal-field">
        <label><i class="fa-solid fa-euro-sign"></i> <span id="im-price-label">${pm.label}</span></label>
        <div class="price-input-wrapper">
          <input type="number" id="im-price" placeholder="0.00" step="0.01" min="0" value="${ing.price||''}" oninput="updateIngModalCost()">
          <button class="btn-lot" id="im-lot-btn" title="Prix au lot" onclick="openLotCalcModal()" style="${!isPiece?'display:none;':''}"><i class="fa-solid fa-calculator"></i></button>
        </div>
        <div id="im-cost-val" class="ing-price-subtext">—</div>
      </div>
    </div>

    <!-- Rayon + Magasin sur une ligne -->
    <div class="ing-modal-grid" style="margin-top:10px;">
      <div class="ing-modal-field">
        <label><i class="fa-solid fa-layer-group"></i> Rayon</label>
        <select id="im-cat">${catOpts}</select>
      </div>
      <div class="ing-modal-field">
        <label><i class="fa-solid fa-store"></i> Magasin</label>
        <div class="ac-wrapper">
          <input type="text" id="im-shop" placeholder="ex: Lidl…" value="${escapeHtml(ing.shop||'')}" oninput="handleShopACModal(this)">
          <div class="ac-box"></div>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-neutral" onclick="closeIngModal()">Annuler</button>
      <button class="btn btn-success" onclick="confirmIngModal(${editIdx !== null ? editIdx : 'null'})">
        <i class="fa-solid fa-check"></i> ${editIdx !== null ? 'Mettre à jour' : 'Ajouter'}
      </button>
    </div>
  </div>`;
  modal.addEventListener('click', e => { if (e.target === modal) closeIngModal(); });
  document.body.appendChild(modal);
  updateIngModalCost();
  setTimeout(() => document.getElementById('im-name')?.focus(), 100);
}

function closeIngModal() {
  stopBarcodeCamera();
  document.getElementById('ing-modal')?.remove();
}

function onIngModalUnitChange(sel) {
  const pm = getPriceMode(sel.value);
  const labelEl = document.getElementById('im-price-label');
  if (labelEl) labelEl.textContent = pm.hint || pm.label;
  const lotBtn = document.getElementById('im-lot-btn');
  if (lotBtn) lotBtn.style.display = pm.mode === 'piece' ? '' : 'none';
  updateIngModalCost();
}

function updateIngModalCost() {
  const qty   = parseFloat(document.getElementById('im-qty')?.value) || 0;
  const unit  = document.getElementById('im-unit')?.value || 'kg';
  const price = parseFloat(document.getElementById('im-price')?.value) || 0;
  const sub = document.getElementById('im-cost-val');
  if (!sub) return;
  if (qty > 0 && price > 0) {
    const cost = computeIngCost(qty, unit, price);
    const pm = getPriceMode(unit);
    let str = `= ${cost.toFixed(2)} €`;
    if (pm.mode === 'weight' || pm.mode === 'volume') str += `  ·  ${price.toFixed(2)} ${pm.label}`;
    sub.textContent = str;
    sub.style.color = 'var(--color-accent)';
  } else {
    sub.textContent = '—';
    sub.style.color = 'var(--color-secondary)';
  }
}

function confirmIngModal(editIdx) {
  const name  = document.getElementById('im-name').value.trim();
  const qty   = parseFloat(document.getElementById('im-qty').value);
  const unit  = document.getElementById('im-unit').value;
  const price = parseFloat(document.getElementById('im-price').value) || 0;
  const cat   = document.getElementById('im-cat').value;
  const shop  = document.getElementById('im-shop').value.trim();
  if (!name) return toast('Nom requis', 'error');
  if (!qty || qty <= 0) return toast('Quantité invalide', 'error');

  // Mode article hors-fiche (depuis PROD)
  if (window._singleMode) {
    window._singleMode = false;
    closeIngModal();
    addSingleFromModal(name, qty, unit, cat, price, shop);
    return;
  }

  const ing = { id: editIdx !== null ? (_ings[editIdx]?.id || Date.now()) : Date.now(), name, qty, unit, price, cat, shop };
  if (editIdx !== null) { _ings[editIdx] = ing; } else { _ings.push(ing); }
  closeIngModal();
  renderIngList();
  toast(editIdx !== null ? `${name} mis à jour ✓` : `${name} ajouté ✓`);
}

// Autocomplete nom dans la modal
function handleIngModalAC(input) {
  const val = input.value.toLowerCase().trim();
  const box = input.nextElementSibling;
  if (val.length < 1) { box.style.display = 'none'; return; }
  const known = [];
  state.recipes.forEach(r => r.ingredients.forEach(i => { if (!known.find(k => k.name.toLowerCase() === i.name.toLowerCase())) known.push(i); }));
  const matches = known.filter(i => i.name.toLowerCase().includes(val)).slice(0, 5);
  if (matches.length) {
    box.innerHTML = matches.map(m => `<div class="ac-item" onclick="selectIngModalAC('${escapeAttr(m.name)}','${escapeAttr(m.unit)}','${escapeAttr(m.cat)}','${m.price||0}','${escapeAttr(m.shop||'')}')">${escapeHtml(m.name)}<span>${m.unit} · ${m.cat}${m.shop?' · '+m.shop:''}</span></div>`).join('');
    box.style.display = 'block';
  } else { box.style.display = 'none'; }
}

function selectIngModalAC(name, unit, cat, price, shop) {
  document.getElementById('im-name').value = name;
  document.getElementById('im-unit').value = unit;
  onIngModalUnitChange(document.getElementById('im-unit'));
  document.getElementById('im-cat').value = cat;
  if (price > 0) document.getElementById('im-price').value = parseFloat(price).toFixed(2);
  if (shop) document.getElementById('im-shop').value = shop;
  document.querySelectorAll('#ing-modal .ac-box').forEach(b => b.style.display = 'none');
  updateIngModalCost();
}

function prefillIngModal(input) {
  const name = input.value.trim().toLowerCase();
  if (!name) return;
  const known = state.recipes.flatMap(r => r.ingredients).filter(i => i.name.toLowerCase() === name);
  if (!known.length) return;
  const last = known[known.length - 1];
  const priceInput = document.getElementById('im-price');
  const shopInput  = document.getElementById('im-shop');
  if (priceInput && !priceInput.value && last.price > 0) { priceInput.value = last.price; updateIngModalCost(); }
  if (shopInput && !shopInput.value && last.shop) shopInput.value = last.shop;
}

function handleShopACModal(input) {
  const val = input.value.toLowerCase().trim();
  const box = input.nextElementSibling;
  if (!box) return;
  if (val.length < 1) { box.style.display = 'none'; return; }
  const allShops = new Set();
  state.recipes.forEach(r => r.ingredients.forEach(i => { if (i.shop) allShops.add(i.shop); }));
  const matches = [...allShops].filter(s => s.toLowerCase().includes(val)).slice(0, 5);
  if (matches.length) {
    box.innerHTML = matches.map(s => `<div class="ac-item" onclick="document.getElementById('im-shop').value='${escapeAttr(s)}'; this.closest('.ac-box').style.display='none'">${escapeHtml(s)}</div>`).join('');
    box.style.display = 'block';
  } else { box.style.display = 'none'; }
}

// Lot calc depuis la modal ingrédient
function openLotCalcModal() {
  const ingName = document.getElementById('im-name')?.value || 'cet article';
  const pending = window._pendingLot || null;
  const modal = document.createElement('div');
  modal.className = 'modal-overlay'; modal.id = 'lot-modal';
  modal.style.zIndex = '10001';
  modal.innerHTML = `<div class="modal-sheet" style="padding:20px;max-height:92vh;overflow-y:auto;">
    <div class="modal-handle"></div>
    <div class="modal-title"><i class="fa-solid fa-calculator" style="color:var(--color-primary);margin-right:8px;"></i>Prix au lot</div>
    <div class="modal-sub">Pour <strong>${escapeHtml(ingName)}</strong></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div>
        <label style="font-size:0.65rem;font-weight:700;color:var(--color-secondary);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px;"><i class="fa-solid fa-layer-group" style="margin-right:4px;"></i>Unités dans le lot</label>
        <input id="lot-count" type="number" min="1" step="1" placeholder="ex: 6" style="width:100%;" value="${pending?.count || ''}">
      </div>
      <div>
        <label style="font-size:0.65rem;font-weight:700;color:var(--color-secondary);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px;"><i class="fa-solid fa-tag" style="margin-right:4px;"></i>Prix du lot (€)</label>
        <input id="lot-price" type="number" min="0" step="0.01" placeholder="ex: 1.80" style="width:100%;" value="${pending?.price ? pending.price.toFixed(2) : ''}">
      </div>
    </div>
    <div id="lot-preview" style="text-align:center;font-size:0.8rem;color:var(--color-secondary);margin-bottom:8px;min-height:1.4em;"></div>
    <div class="modal-actions">
      <button class="btn btn-neutral" onclick="document.getElementById('lot-modal').remove(); window._pendingLot=null;">Annuler</button>
      <button class="btn btn-success" onclick="confirmLotCalcModal()"><i class="fa-solid fa-check"></i> Appliquer</button>
    </div>
  </div>`;
  modal.addEventListener('click', e => { if (e.target === modal) { modal.remove(); window._pendingLot = null; } });
  document.body.appendChild(modal);
  const update = () => {
    const cnt = parseFloat(document.getElementById('lot-count').value);
    const prc = parseFloat(document.getElementById('lot-price').value);
    const prev = document.getElementById('lot-preview');
    if (cnt > 0 && prc > 0) prev.innerHTML = `<span style="color:var(--color-accent);font-weight:700;font-size:1rem;">${(prc/cnt).toFixed(3)} €</span> / unité`;
    else prev.textContent = '';
  };
  document.getElementById('lot-count').addEventListener('input', update);
  document.getElementById('lot-price').addEventListener('input', update);
  // Déclenche preview si pré-rempli
  if (pending?.count && pending?.price) update();
}

function confirmLotCalcModal() {
  const cnt = parseFloat(document.getElementById('lot-count').value);
  const prc = parseFloat(document.getElementById('lot-price').value);
  if (!cnt || !prc || cnt <= 0 || prc <= 0) { toast('Remplis les deux champs', 'error'); return; }
  document.getElementById('im-price').value = (prc / cnt).toFixed(4);
  updateIngModalCost();
  document.getElementById('lot-modal').remove();
  window._pendingLot = null;
  toast(`${(prc/cnt).toFixed(3)} €/unité calculé ✓`);
}

// ── Modifier qty d'une prod depuis le banner ─────────────────────────────
function _recomputeSessionCost() {
  const sess = currentSession();
  let total = 0;
  for (const [name, qty] of Object.entries(sess.recipes)) {
    const recipe = state.recipes.find(r => r.name === name);
    if (recipe) total += recipeUnitCost(recipe) * qty;
  }
  sess.totalCost = parseFloat(total.toFixed(2));
}

function adjustProdQty(name, delta) {
  const sess = currentSession();
  if (!(name in sess.recipes)) return;
  const newQty = (sess.recipes[name] || 0) + delta;
  if (newQty <= 0) {
    if (!confirm(`Retirer ${name} de la liste ?`)) return;
    delete sess.recipes[name];
    const recipe = state.recipes.find(r => r.name === name);
    if (recipe) recipe.ingredients.forEach(ing => {
      const idx = sess.list.findIndex(i => i.name === ing.name && i.unit === ing.unit);
      if (idx >= 0) sess.list.splice(idx, 1);
    });
  } else {
    sess.recipes[name] = newQty;
    _recalcListForRecipe(name, newQty);
  }
  _recomputeSessionCost();
  pushUndoState();
  saveState();
}

function setProdQty(name, val) {
  const newQty = parseInt(val);
  if (isNaN(newQty) || newQty < 1) return;
  const sess = currentSession();
  sess.recipes[name] = newQty;
  _recalcListForRecipe(name, newQty);
  _recomputeSessionCost();
  pushUndoState();
  saveState();
}

function _recalcListForRecipe(name, qty) {
  // Recalcule les quantités dans la liste pour cette recette
  const recipe = state.recipes.find(r => r.name === name);
  if (!recipe) return;
  const sess = currentSession();
  recipe.ingredients.forEach(ing => {
    const item = sess.list.find(i => i.name === ing.name && i.unit === ing.unit);
    if (item) {
      // Recalcul simple : on met à jour au prorata (approximatif mais utile)
      item.qty = parseFloat((ing.qty * qty).toFixed(4));
    }
  });
}

// ── Undo / Redo ──────────────────────────────────────────────────────────
const _undoStack = [];
const _redoStack = [];
const MAX_UNDO = 30;

function pushUndoState() {
  const sess = currentSession();
  _undoStack.push(JSON.stringify({ list: sess.list, recipes: sess.recipes, singles: sess.singles, totalCost: sess.totalCost }));
  if (_undoStack.length > MAX_UNDO) _undoStack.shift();
  _redoStack.length = 0;
  updateUndoButtons();
}

function undoList() {
  if (!_undoStack.length) return;
  const sess = currentSession();
  _redoStack.push(JSON.stringify({ list: sess.list, recipes: sess.recipes, singles: sess.singles, totalCost: sess.totalCost }));
  const prev = JSON.parse(_undoStack.pop());
  sess.list = prev.list; sess.recipes = prev.recipes; sess.singles = prev.singles; sess.totalCost = prev.totalCost;
  updateUndoButtons();
  saveState();
  toast('Annulé ✓', 'info');
}

function redoList() {
  if (!_redoStack.length) return;
  const sess = currentSession();
  _undoStack.push(JSON.stringify({ list: sess.list, recipes: sess.recipes, singles: sess.singles, totalCost: sess.totalCost }));
  const next = JSON.parse(_redoStack.pop());
  sess.list = next.list; sess.recipes = next.recipes; sess.singles = next.singles; sess.totalCost = next.totalCost;
  updateUndoButtons();
  saveState();
  toast('Rétabli ✓', 'info');
}

function updateUndoButtons() {
  const undo = document.getElementById('btn-undo');
  const redo = document.getElementById('btn-redo');
  if (undo) { undo.style.opacity = _undoStack.length ? '1' : '0.3'; undo.style.pointerEvents = _undoStack.length ? '' : 'none'; }
  if (redo) { redo.style.opacity = _redoStack.length ? '1' : '0.3'; redo.style.pointerEvents = _redoStack.length ? '' : 'none'; }
}
let _barcodeStream = null;
let _barcodeInterval = null;

async function startBarcodeCamera() {
  const btn = document.getElementById('btn-cam-scan');
  const container = document.getElementById('barcode-video-container');
  if (_barcodeStream) { stopBarcodeCamera(); return; }
  btn.classList.add('scanning');
  btn.innerHTML = '<i class="fa-solid fa-stop"></i>';
  container.style.display = 'block';
  try {
    _barcodeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('barcode-video');
    video.srcObject = _barcodeStream;
    // Utilise BarcodeDetector si dispo (Chrome/Android natif)
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e'] });
      _barcodeInterval = setInterval(async () => {
        try {
          const codes = await detector.detect(video);
          if (codes.length) {
            const code = codes[0].rawValue;
            stopBarcodeCamera();
            lookupBarcode(code);
          }
        } catch(e) {}
      }, 400);
    } else {
      // Fallback : on affiche juste la caméra et suggère la saisie manuelle
      showOffResult('⚠️ Scan automatique non supporté sur ce navigateur — saisis le code manuellement ci-dessous', false);
      toggleManualBarcode();
    }
  } catch(e) {
    stopBarcodeCamera();
    showOffResult('⚠️ Caméra inaccessible — saisis le code manuellement', false);
    toggleManualBarcode();
    toast('Caméra inaccessible', 'error');
  }
}

function stopBarcodeCamera() {
  if (_barcodeInterval) { clearInterval(_barcodeInterval); _barcodeInterval = null; }
  if (_barcodeStream) { _barcodeStream.getTracks().forEach(t => t.stop()); _barcodeStream = null; }
  const btn = document.getElementById('btn-cam-scan');
  if (btn) { btn.classList.remove('scanning'); btn.innerHTML = '<i class="fa-solid fa-barcode"></i>'; }
  const container = document.getElementById('barcode-video-container');
  if (container) container.style.display = 'none';
}

function toggleManualBarcode() {
  const row = document.getElementById('barcode-manual-row');
  if (!row) return;
  const shown = row.style.display !== 'none';
  row.style.display = shown ? 'none' : 'flex';
  if (!shown) setTimeout(() => document.getElementById('barcode-manual-input')?.focus(), 80);
}

async function lookupBarcode(code) {
  code = String(code).trim().replace(/\D/g,'');
  if (!code || code.length < 8) { toast('Code invalide', 'error'); return; }
  showOffResult(`<i class="fa-solid fa-spinner fa-spin"></i> Recherche du produit…`, false);

  try {
    // 1. Open Food Facts : nom, rayon, quantité
    const offRes = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}?fields=product_name,product_name_fr,categories_tags,quantity,product_quantity,product_quantity_unit`);
    const offData = await offRes.json();

    if (offData.status !== 1 || !offData.product) {
      showOffResult(`<i class="fa-solid fa-triangle-exclamation" style="color:var(--color-accent)"></i> Produit introuvable (${code})`, false);
      return;
    }

    const p = offData.product;
    const name = p.product_name_fr || p.product_name || '';
    const cats = p.categories_tags || [];
    const cat  = mapOFFCategory(cats);

    // ── Détecter quantité + unité + format paquet ──────────────────
    let detectedQty = null;
    let detectedUnit = null;
    let isMultipack = false;   // ex: 6 x 50g → vendre à la pièce/paquet
    let packCount = null;      // nb d'unités dans le lot (pour lot calc auto)
    let packUnitQty = null;    // quantité par unité dans le lot
    let packUnitUnit = null;

    const rawQty = p.quantity || '';

    // Format "N x Q unité" ou "N × Q unité" (ex: "6 x 50 g", "12x25g")
    const multiMatch = rawQty.match(/(\d+)\s*[x×]\s*([\d.,]+)\s*(kg|g|L|cl|ml)/i);
    if (multiMatch) {
      isMultipack = true;
      packCount = parseInt(multiMatch[1]);
      packUnitQty = parseFloat(multiMatch[2].replace(',', '.'));
      packUnitUnit = mapOFFUnit(multiMatch[3]);
      detectedQty = 1;
      detectedUnit = 'paquet';
    }
    // Format "N biscuits/unités/portions" etc.
    else if (/\d+\s*(biscuit|biscuits|unit|units|portion|portions|piece|pieces|pièce|pièces|tablette|tablettes)/i.test(rawQty)) {
      const nm = rawQty.match(/(\d+)/);
      isMultipack = true;
      packCount = nm ? parseInt(nm[1]) : null;
      detectedQty = 1;
      detectedUnit = 'paquet';
    }
    // Format standard "500 g", "1 L", etc.
    else if (p.product_quantity && p.product_quantity_unit) {
      detectedQty = parseFloat(p.product_quantity);
      detectedUnit = mapOFFUnit(p.product_quantity_unit);
    } else {
      const qMatch = rawQty.match(/([\d.,]+)\s*(kg|g|L|cl|ml|l)/i);
      if (qMatch) {
        detectedQty = parseFloat(qMatch[1].replace(',', '.'));
        detectedUnit = mapOFFUnit(qMatch[2]);
      }
    }

    // Remplir nom + rayon
    if (name) document.getElementById('im-name').value = name;
    document.getElementById('im-cat').value = cat;

    // Quantité + unité
    const qtyInput = document.getElementById('im-qty');
    const unitSel  = document.getElementById('im-unit');
    if (detectedQty && !qtyInput.value) qtyInput.value = detectedQty;
    if (detectedUnit) {
      // Ajoute "paquet" dynamiquement si pas déjà dans la liste
      if (detectedUnit === 'paquet' && ![...unitSel.options].find(o => o.value === 'paquet')) {
        const opt = document.createElement('option');
        opt.value = 'paquet'; opt.textContent = 'paquet';
        unitSel.appendChild(opt);
      }
      const opt = [...unitSel.options].find(o => o.value === detectedUnit);
      if (opt) { unitSel.value = detectedUnit; onIngModalUnitChange(unitSel); }
    }

    // 2. Open Prices : prix réel du produit en France
    showOffResult(`<i class="fa-solid fa-spinner fa-spin"></i> <strong>${escapeHtml(name)}</strong> — recherche du prix…`, false);
    let priceFound = false;
    try {
      const priceRes = await fetch(`https://prices.openfoodfacts.org/api/v1/prices?product_code=${code}&currency=EUR&country=FR&size=10&order_by=-date`);
      const priceData = await priceRes.json();
      if (priceData.items && priceData.items.length > 0) {
        const prices = priceData.items.map(i => parseFloat(i.price)).filter(v => !isNaN(v) && v > 0).sort((a,b) => a-b);
        if (prices.length) {
          const median = prices[Math.floor(prices.length / 2)];
          let priceEntry = median;
          let priceLabel = `${median.toFixed(2)} €`;

          if (detectedUnit === 'paquet' || isMultipack) {
            // Prix au paquet = prix direct
            priceEntry = median;
            priceLabel = `${median.toFixed(2)} €/paquet`;
            // Si on connaît le nombre d'unités, on peut aussi afficher le prix unitaire
            if (packCount) priceLabel += `  (${(median/packCount).toFixed(3)} €/unité)`;
          } else if (detectedQty && detectedUnit) {
            const pm = getPriceMode(detectedUnit);
            if (pm.mode === 'weight') {
              const qtyKg = detectedUnit === 'g' ? detectedQty / 1000 : detectedQty;
              priceEntry = median / qtyKg;
              priceLabel = `${priceEntry.toFixed(2)} €/kg  (produit : ${median.toFixed(2)} €)`;
            } else if (pm.mode === 'volume') {
              const qtyL = detectedUnit === 'cl' ? detectedQty / 100 : detectedUnit === 'ml' ? detectedQty / 1000 : detectedQty;
              priceEntry = median / qtyL;
              priceLabel = `${priceEntry.toFixed(2)} €/L  (produit : ${median.toFixed(2)} €)`;
            } else {
              priceEntry = median;
              priceLabel = `${median.toFixed(2)} €/unité`;
            }
          }

          const priceInput = document.getElementById('im-price');
          if (priceInput && !priceInput.value) {
            priceInput.value = priceEntry.toFixed(4);
            updateIngModalCost();
          }

          // Si multipack et prix connu → pré-remplir les champs lot calc
          if (isMultipack && packCount && median > 0) {
            // On stocke pour que l'utilisateur puisse ouvrir le lot calc pré-rempli
            window._pendingLot = { count: packCount, price: median };
          }

          priceFound = true;
          const packInfo = isMultipack && packCount ? ` · <strong>${packCount} unités/paquet</strong>` : '';
          const qtyStr = detectedQty && detectedUnit && !isMultipack ? ` · ${detectedQty} ${detectedUnit}` : '';
