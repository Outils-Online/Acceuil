          showOffResult(`<i class="fa-solid fa-check" style="color:var(--color-primary)"></i> <strong>${escapeHtml(name)}</strong> — ${escapeHtml(cat)}${qtyStr}${packInfo}<br><i class="fa-solid fa-tag" style="font-size:0.65rem;margin-right:3px;color:var(--color-accent)"></i> Prix estimé : <strong>${priceLabel}</strong> <span style="opacity:0.6">(médiane ${prices.length} scan${prices.length>1?'s':''})</span>`, true);
        }
      }
    } catch(e) { /* prix pas dispo, pas grave */ }

    if (!priceFound) {
      prefillIngModal(document.getElementById('im-name'));
      updateIngModalCost();
      const packInfo = isMultipack && packCount ? ` · <strong>${packCount} unités/paquet</strong>` : '';
      const qtyStr = detectedQty && detectedUnit && !isMultipack ? ` · ${detectedQty} ${detectedUnit}` : '';
      const priceHint = isMultipack
        ? `<i class="fa-solid fa-calculator" style="font-size:0.65rem;margin-right:3px;color:var(--color-primary)"></i> Saisis le prix du paquet puis utilise le <strong>calculateur lot</strong>`
        : `<i class="fa-solid fa-tag" style="font-size:0.65rem;margin-right:3px;"></i> Prix non trouvé — saisis-le manuellement`;
      showOffResult(`<i class="fa-solid fa-check" style="color:var(--color-primary)"></i> <strong>${escapeHtml(name)}</strong> — ${escapeHtml(cat)}${qtyStr}${packInfo}<br><span style="opacity:0.85">${priceHint}</span>`, true);
    }

  } catch(e) {
    showOffResult(`<i class="fa-solid fa-wifi" style="color:var(--color-accent)"></i> Erreur réseau — remplis manuellement`, false);
  }
}

function mapOFFUnit(u) {
  if (!u) return null;
  const s = u.toLowerCase().trim();
  if (s === 'kg') return 'kg';
  if (s === 'g')  return 'g';
  if (s === 'l')  return 'L';
  if (s === 'cl') return 'cl';
  if (s === 'ml') return 'ml';
  return null;
}

function showOffResult(html, found) {
  const el = document.getElementById('off-result');
  if (!el) return;
  el.innerHTML = html;
  el.style.display = 'block';
  el.className = 'off-result' + (found ? ' found' : '');
}

function mapOFFCategory(tags) {
  const t = tags.join(' ').toLowerCase();
  if (t.includes('meat') || t.includes('viande') || t.includes('charcuterie') || t.includes('sausage')) return 'Viandes';
  if (t.includes('fish') || t.includes('seafood') || t.includes('poisson')) return 'Poissons';
  if (t.includes('dairy') || t.includes('cheese') || t.includes('milk') || t.includes('lait') || t.includes('fromage') || t.includes('yaourt') || t.includes('yogurt') || t.includes('egg') || t.includes('oeuf')) return 'Produits frais';
  if (t.includes('frozen') || t.includes('surgel')) return 'Surgelés';
  if (t.includes('beverage') || t.includes('drink') || t.includes('water') || t.includes('juice') || t.includes('boisson') || t.includes('eau') || t.includes('jus')) return 'Liquides';
  if (t.includes('fruit') || t.includes('vegetable') || t.includes('legume') || t.includes('legume')) return 'Fruits & Légumes';
  if (t.includes('sweet') || t.includes('biscuit') || t.includes('chocolate') || t.includes('confection') || t.includes('sucre') || t.includes('gateau') || t.includes('cake')) return 'Épicerie sucrée';
  return 'Épicerie salée';
}

// Table de conversion d'unités (facteur pour passer de fromUnit à toUnit)
function convertQty(qty, fromUnit, toUnit) {
  if (fromUnit === toUnit) return qty;
  const toBase = { g:1, kg:1000, mg:0.001, ml:1, l:1000, cl:10, dl:100, oz:28.35, lb:453.6, tsp:5, tbsp:15, cup:240, 'fl_oz':29.57 };
  const fromBase = toBase[fromUnit], toBase2 = toBase[toUnit];
  // Même famille (masse ou volume) → conversion directe
  if (fromBase !== undefined && toBase2 !== undefined) {
    const massUnits   = new Set(['g','kg','mg','oz','lb']);
    const volumeUnits = new Set(['ml','l','cl','dl','tsp','tbsp','cup','fl_oz']);
    const sameFamily = (massUnits.has(fromUnit) && massUnits.has(toUnit))
                    || (volumeUnits.has(fromUnit) && volumeUnits.has(toUnit));
    if (sameFamily) return parseFloat(((qty * fromBase) / toBase2).toFixed(4));
  }
  // Unités incompatibles (ex: g → ml) : on ne convertit pas
  return qty;
}

// Synchronise toutes les sessions après modification d'une fiche
function syncRecipeToSessions(oldIngredients, newIngredients) {
  // Map des anciens ingrédients par nom (lower)
  const oldMap = {};
  oldIngredients.forEach(i => { oldMap[i.name.toLowerCase()] = i; });

  // Map des nouveaux ingrédients par nom (lower)
  const newMap = {};
  newIngredients.forEach(i => { newMap[i.name.toLowerCase()] = i; });

  // Pour chaque ingrédient modifié ou renommé, on cherche les items dans les sessions
  newIngredients.forEach(newIng => {
    const key = newIng.name.toLowerCase();
    const oldIng = oldMap[key];
    if (!oldIng) return; // nouvel ingrédient, pas encore dans les listes

    // Détecter s'il y a un changement
    const changed = oldIng.price !== newIng.price
                 || oldIng.shop  !== newIng.shop
                 || oldIng.cat   !== newIng.cat
                 || oldIng.unit  !== newIng.unit;
    if (!changed) return;

    // Appliquer à toutes les sessions
    state.sessions.forEach(sess => {
      sess.list.forEach(item => {
        if (item.name.toLowerCase() !== key) return;
        // Conversion de quantité si l'unité change
        if (oldIng.unit !== newIng.unit && item.unit === oldIng.unit) {
          item.qty  = convertQty(item.qty, oldIng.unit, newIng.unit);
          item.unit = newIng.unit;
        }
        // Synchronisation des autres champs (fiche = source de vérité)
        item.price = newIng.price || 0;
        item.shop  = newIng.shop  || '';
        item.cat   = newIng.cat   || item.cat;
      });
    });
  });
}

function saveRecipe() {
  const name = document.getElementById('recipe-name').value.trim();
  if (!name) return toast('Nom de fiche requis', 'error');
  const dupCheck = state.recipes.find(r => r.name.toLowerCase() === name.toLowerCase() && r.id !== state.editingId);
  if (dupCheck) return toast('Ce nom existe déjà', 'error');
  if (!_ings.length) return toast('Ajoute au moins un ingrédient', 'error');
  const valid = _ings.every(i => i.name && i.qty > 0);
  if (!valid) return toast('Vérifie les ingrédients (nom & quantité)', 'error');
  if (state.editingId) {
    const idx = state.recipes.findIndex(r => r.id === state.editingId);
    const oldIngredients = state.recipes[idx].ingredients.map(i => ({...i}));
    state.recipes[idx] = { id: state.editingId, name, ingredients: [..._ings] };
    syncRecipeToSessions(oldIngredients, _ings);
    toast(`${name} mis à jour ✓`);
  } else {
    state.recipes.push({ id: Date.now(), name, ingredients: [..._ings] });
    toast(`${name} créé ✓`);
  }
  cancelEdit(); saveState();
}

function buildSortView() {

  allCats.forEach(cat => {

function convertToKgAndCeil(qty, unit) {
  const INTEGER_UNITS = ['pièce','boîte','sachet','portion','botte','tranche','dose'];
  let value = qty, displayUnit = unit;
  if (unit === 'g') { value = qty / 1000; displayUnit = 'kg'; }
  else if (unit === 'kg') { value = qty; displayUnit = 'kg'; }
  else if (unit === 'L' || unit === 'cl' || unit === 'ml') {
    if (unit === 'cl') value = qty / 100; else if (unit === 'ml') value = qty / 1000;
    displayUnit = 'L';
  } else { displayUnit = unit; }
  const ceiled = Math.ceil(value * 100) / 100;
  return { value: ceiled, unit: displayUnit, isInteger: INTEGER_UNITS.includes(unit) };
}

function hashCode(str) { let hash = 0; for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; } return Math.abs(hash); }
function recipeColor(recipeName) { return `hsl(${hashCode(recipeName) % 360}, 70%, 65%)`; }
function recipeUnitCost(recipe) { return recipe.ingredients.reduce((sum, i) => sum + computeIngCost(i.qty, i.unit, i.price || 0), 0); }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }
function escapeFilename(s) { return String(s).replace(/[^a-zA-Z0-9_\-À-ÿ]/g, '_').substring(0, 40); }
function dateStr() { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }

function _buildProductionsBlock(sess, lines) {
  const recipeIngKeys = new Set(
    state.recipes.flatMap(r => r.ingredients).map(i => i.name.toLowerCase() + '|' + i.unit)
  );
  const singleItems = sess.list.filter(i => !recipeIngKeys.has(i.name.toLowerCase() + '|' + i.unit));
  const prodEntries = Object.entries(sess.recipes);
  const hasProd = prodEntries.length > 0;
  const hasSingles = singleItems.length > 0;
  if (!hasProd && !hasSingles) return;

  lines.push('');
  lines.push('📋  PRODUCTIONS');
  let totalKnown = 0; let hasUnknown = false;

  prodEntries.forEach(([name, qty]) => {
    const recipe = state.recipes.find(r => r.name === name);
    if (recipe) {
      const unitCost = recipeUnitCost(recipe);
      const hasAll = recipe.ingredients.every(i => i.price > 0);
      const ingCount = recipe.ingredients.length;
      if (hasAll && unitCost > 0) {
        const batch = unitCost * qty;
        lines.push(`    ${qty}×  ${name}  (${ingCount} produit${ingCount>1?'s':''})  →  ~${batch.toFixed(2)} €`);
        totalKnown += batch;
      } else {
        lines.push(`    ${qty}×  ${name}  (${ingCount} produit${ingCount>1?'s':''})  →  xx €`);
        hasUnknown = true;
      }
    } else {
      lines.push(`    ${qty}×  ${name}  →  xx €`); hasUnknown = true;
    }
  });

  if (hasSingles) {
    const singleCost = singleItems.reduce((s, i) => s + computeIngCost(i.qty, i.unit, i.price || 0), 0);
    const singleAllKnown = singleItems.every(i => (i.price || 0) > 0);
    const n = singleItems.length;
    if (singleAllKnown && singleCost > 0) {
      lines.push(`    + ${n} article${n>1?'s':''} hors-fiche  →  ~${singleCost.toFixed(2)} €`);
      totalKnown += singleCost;
    } else {
      lines.push(`    + ${n} article${n>1?'s':''} hors-fiche  →  ${singleCost > 0 ? '~'+singleCost.toFixed(2)+' € + xx €' : 'xx €'}`);
      hasUnknown = true;
      totalKnown += singleCost;
    }
  }

  lines.push('');
  const totalStr = totalKnown > 0 ? `~${totalKnown.toFixed(2)} €` : '';
  const unknownStr = hasUnknown ? 'xx €' : '';
  const totalDisplay = [totalStr, unknownStr].filter(Boolean).join(' + ');
  lines.push(`    TOTAL  →  ${totalDisplay || '—'}`);
}

function exportTXT() {
  const sess = currentSession();
  if (!sess.list.length) return toast('La liste est vide', 'error');
  const lines = [];
  const sep  = '─'.repeat(32);
  const sep2 = '· · ·';

  lines.push(`🛒  ${sess.name}`);
  lines.push(sep);

  _buildProductionsBlock(sess, lines);

  // --- COURSES PAR RAYON ---
  lines.push('');
  lines.push(sep);
  lines.push('');
  lines.push('🏪  COURSES');

  // Regroupe par rayon, puis par magasin à l'intérieur
  const grouped = {};
  sess.list.forEach(item => {
    if (!grouped[item.cat]) grouped[item.cat] = [];
    const ingInfo = state.recipes.flatMap(r => r.ingredients).find(i => i.name === item.name && i.unit === item.unit);
    const existing = grouped[item.cat].find(i => i.name === item.name && i.unit === item.unit);
    if (existing) { existing.qty += item.qty; }
    else grouped[item.cat].push({
      name: item.name, qty: item.qty, unit: item.unit,
      price: ingInfo?.price || item.price || 0, shop: ingInfo?.shop || item.shop || '',
      done: item.done
    });
  });

  const ordered = state.categoryOrder.filter(c => grouped[c])
    .concat(Object.keys(grouped).filter(c => !state.categoryOrder.includes(c)));

  ordered.forEach(cat => {
    if (!grouped[cat]) return;
    lines.push('');
    lines.push(`  ${cat.toUpperCase()}`);

    // Sous-grouper par magasin
    const byShop = {};
    grouped[cat].forEach(item => {
      const key = item.shop || '';
      if (!byShop[key]) byShop[key] = [];
      byShop[key].push(item);
    });

    // D'abord les items sans magasin, puis par magasin
    const shopKeys = Object.keys(byShop).sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b));
    shopKeys.forEach((shopKey, si) => {
      if (shopKey) lines.push(`    🏬 ${shopKey}`);
      byShop[shopKey].forEach(item => {
        const conv = convertToKgAndCeil(item.qty, item.unit);
        const qtyStr = conv.isInteger
          ? String(Math.ceil(conv.value))
          : conv.value.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
        let priceStr = '';
        if (item.price > 0) {
          const pm = getPriceMode(item.unit);
          priceStr = `  (${item.price.toFixed(2)} ${pm.label})`;
        }
        const check = item.done ? '✓ ' : '☐ ';
        lines.push(`    ${check}${item.name} : ${qtyStr} ${conv.unit}${priceStr}`);
      });
      if (si < shopKeys.length - 1 && shopKey) lines.push('');
    });
  });

  lines.push('');
  lines.push(sep);

  const txt = lines.join('\n');
  navigator.clipboard.writeText(txt)
    .then(() => toast('Liste copiée ✓'))
    .catch(() => toast('Erreur lors de la copie', 'error'));
}

    !state.recipes.some(r => r.ingredients.some(ing => ing.name === i.name && ing.unit === i.unit))
  );
  const singleCostTotal = singleItemsForCost.reduce((s, i) => s + computeIngCost(i.qty, i.unit, i.price || 0), 0);
  const totalWithSingles = (sess.totalCost || 0) + singleCostTotal;
  if (totalWithSingles > 0) { document.getElementById('session-cost-total').textContent = totalWithSingles.toFixed(2) + ' €'; costBadge.style.display = 'flex'; } else { costBadge.style.display = 'none'; }
  document.getElementById('cnt-todo').textContent = sess.list.filter(i => !i.done).length;
  document.getElementById('cnt-done').textContent = sess.list.filter(i => i.done).length;

  // --- Filtrage des articles ---
  let items = sess.list.filter(i => i.done === (state.listMode === 'done'));
  if (af) {
    if (af.type === 'manual') {
      const recipeIngKeys = new Set(
        state.recipes.flatMap(r => r.ingredients).map(i => i.name.toLowerCase() + '|' + i.unit)
      );
      items = items.filter(i => !recipeIngKeys.has(i.name.toLowerCase() + '|' + i.unit));
    } else if (af.type === 'recipe') {
      const recipe = state.recipes.find(r => r.name === af.value);
      const ingNames = recipe ? new Set(recipe.ingredients.map(i => i.name.toLowerCase())) : new Set();
      items = items.filter(i => ingNames.has(i.name.toLowerCase()));
    } else if (af.type === 'shop') {
      items = items.filter(item => {
        const ingInfo = state.recipes.flatMap(r => r.ingredients).find(i => i.name === item.name && i.unit === item.unit);
        const shop = ingInfo?.shop || item.shop || '';
        return shop === af.value;
      });
    }
  }

  const display = document.getElementById('list-display');
  document.getElementById('list-filtered-display').innerHTML = '';
  display.innerHTML = '';
  if (!items.length) {
    display.innerHTML = `<div class="empty"><i class="fa-solid fa-${state.listMode==='done'?'check-double':'list-check'}"></i><p>${state.listMode==='done'?'Aucun article coché':af?'Aucun article pour ce filtre':'La liste est vide'}</p></div>`;
    return;
  }

  const producedRecipeNames = new Set(Object.keys(sess.recipes));

  const grouped = {};
  items.forEach(i => { grouped[i.cat] = grouped[i.cat] || []; grouped[i.cat].push(i); });
  const ordered = state.categoryOrder.filter(c => grouped[c]).concat(Object.keys(grouped).filter(c => !state.categoryOrder.includes(c)));

  // Sépare les rayons entièrement cochés des rayons actifs
  const activeOrdered = ordered.filter(cat => grouped[cat]?.some(i => !i.done));
  const doneOrdered   = ordered.filter(cat => grouped[cat]?.every(i => i.done));

  const renderCat = (cat, dimmed) => {
    if (!grouped[cat]) return;
    const allDone = grouped[cat].every(i => i.done);
    display.innerHTML += `<div class="category-header${dimmed ? ' cat-done' : ''}">${escapeHtml(cat)}${allDone ? ' <i class="fa-solid fa-check" style="font-size:0.6rem;opacity:0.5;margin-left:4px;"></i>' : ''}</div>`;
    grouped[cat].forEach(item => {
      const relatedRecipes = state.recipes.filter(recipe =>
        producedRecipeNames.has(recipe.name) &&
        recipe.ingredients.some(ing => ing.name === item.name && ing.unit === item.unit)
      );
      const dotsHtml = relatedRecipes.map(recipe =>
        `<span class="recipe-dot" style="background:${recipeColor(recipe.name)};" title="${escapeAttr(recipe.name)}"></span>`
      ).join('');
      const ingInfo = state.recipes.flatMap(r => r.ingredients).find(i => i.name === item.name && i.unit === item.unit);
      // Pour les articles hors-fiche, utilise les données directes de l'item
      const shopVal = ingInfo?.shop || item.shop || '';
      const priceVal = ingInfo?.price || item.price || 0;
      const priceUnit = ingInfo?.unit || item.unit;
      const shopTag = shopVal ? `<span class="item-shop"><i class="fa-solid fa-store"></i> ${escapeHtml(shopVal)}</span>` : '';
      const priceTag = (() => {
        if (!priceVal) return '';
        const pm = getPriceMode(priceUnit);
        return `<span class="item-price-tag">${priceVal.toFixed(2)} ${pm.label}</span>`;
      })();
      const converted = convertToKgAndCeil(item.qty, item.unit);
      const displayQty = converted.isInteger
        ? String(Math.ceil(converted.value))
        : converted.value.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(',', '.');
      display.innerHTML += `<div class="list-item ${item.done ? 'done' : ''}${dimmed ? ' item-dimmed' : ''}">
        <button class="btn-icon btn-icon-trash" onclick="delItem('${escapeAttr(item.name)}','${escapeAttr(item.unit)}')"><i class="fa-solid fa-trash"></i></button>
        <div class="item-info">
          <span class="item-name">${escapeHtml(item.name)}</span>
          <div class="item-meta-row">${dotsHtml}${shopTag}${priceTag}</div>
        </div>
        <div class="list-qty">
          <span class="qty-big">${displayQty}</span>
          <span class="qty-unit">${converted.unit}</span>
        </div>
        <button class="btn-icon btn-icon-check" onclick="toggleItem('${escapeAttr(item.name)}','${escapeAttr(item.unit)}')"><i class="fa-solid fa-${item.done ? 'rotate-left' : 'check'}"></i></button>
      </div>`;
    });
  };

  activeOrdered.forEach(cat => renderCat(cat, false));

  if (doneOrdered.length) {
    display.innerHTML += `<div class="cat-done-separator"><i class="fa-solid fa-check-double"></i> Rayons terminés</div>`;
    doneOrdered.forEach(cat => renderCat(cat, true));
  }
}

/* ---------- recipe import ---------- */
function handleImportFile(input) { const file = input.files[0]; if (!file) return; readImportFile(file); input.value = ''; }
function readImportFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const recipes = parseImportedRecipes(data);
      if (!recipes.length) { toast('Aucune fiche valide trouvée', 'error'); return; }
      showImportModal(recipes);
    } catch(err) { toast('Fichier JSON invalide', 'error'); }
  };
  reader.readAsText(file);
}
function parseImportedRecipes(data) {
  let candidates = [];
  if (data && Array.isArray(data.recipes)) candidates = data.recipes;
  else if (Array.isArray(data)) candidates = data;
  else if (data && typeof data === 'object' && data.name && Array.isArray(data.ingredients)) candidates = [data];
  return candidates.filter(r => r && typeof r.name === 'string' && r.name.trim() && Array.isArray(r.ingredients) && r.ingredients.length > 0).map(r => ({ id: r.id || Date.now() + Math.random(), name: r.name.trim(), ingredients: r.ingredients.map(i => ({ name: i.name || '', qty: parseFloat(i.qty) || 0, unit: i.unit || 'pièce', cat: i.cat || 'Autre', price: parseFloat(i.price) || 0 })).filter(i => i.name && i.qty > 0) })).filter(r => r.ingredients.length > 0);
}
function showImportModal(recipes) {
  const existingNames = new Set(state.recipes.map(r => r.name.toLowerCase()));
  const itemsHtml = recipes.map((r, idx) => {
    const cost = r.ingredients.reduce((s, i) => s + (i.price || 0), 0);
    const costText = cost > 0 ? ` · ${cost.toFixed(2)} €` : '';
    const exists = existingNames.has(r.name.toLowerCase());
    const badge = exists ? `<span class="badge-exists"><i class="fa-solid fa-triangle-exclamation"></i> Existe déjà</span>` : `<span class="badge-new"><i class="fa-solid fa-plus"></i> Nouveau</span>`;
    return `<label class="import-recipe-item"><input type="checkbox" class="import-check" data-idx="${idx}" ${exists ? '' : 'checked'}><div class="info"><div class="name">${escapeHtml(r.name)}</div><div class="meta">${r.ingredients.length} ingrédient${r.ingredients.length>1?'s':''}${costText}</div><div>${badge}</div></div></label>`;
  }).join('');
  const modal = document.createElement('div'); modal.className = 'modal-overlay'; modal.id = 'import-modal';
  modal.innerHTML = `<div class="modal-sheet"><div class="modal-handle"></div><div class="modal-title"><i class="fa-solid fa-file-import" style="color:var(--color-primary);margin-right:8px;"></i>${recipes.length} fiche${recipes.length>1?'s':''} détectée${recipes.length>1?'s':''}</div><div class="modal-sub">Sélectionne les fiches à importer. Les fiches existantes seront <strong style="color:var(--color-accent)">écrasées</strong> si cochées.</div><div id="import-list">${itemsHtml}</div><div class="modal-actions"><button class="btn btn-neutral" onclick="closeImportModal()">Annuler</button><button class="btn btn-success" id="confirm-import-btn">Importer la sélection</button></div></div>`;
  modal.addEventListener('click', e => { if (e.target === modal) closeImportModal(); });
  document.body.appendChild(modal);
  document.getElementById('confirm-import-btn').onclick = () => confirmImport(recipes);
}
function confirmImport(recipes) {
  const checks = document.querySelectorAll('#import-modal .import-check');
  const selectedIndices = []; checks.forEach(cb => { if (cb.checked) selectedIndices.push(parseInt(cb.dataset.idx)); });
  if (selectedIndices.length === 0) { toast('Aucune fiche sélectionnée', 'error'); return; }
  let added = 0, replaced = 0;
  selectedIndices.forEach(idx => {
    const r = recipes[idx];
    const existingIdx = state.recipes.findIndex(x => x.name.toLowerCase() === r.name.toLowerCase());
    if (existingIdx >= 0) { state.recipes[existingIdx] = { ...r, id: state.recipes[existingIdx].id }; replaced++; }
    else { state.recipes.push({ ...r, id: Date.now() + Math.random() }); added++; }
  });
  closeImportModal(); saveState();
  const msgParts = []; if (added) msgParts.push(`${added} ajoutée${added>1?'s':''}`); if (replaced) msgParts.push(`${replaced} mise${replaced>1?'s':''} à jour`);
  toast(msgParts.join(', ') + ' ✓', 'success');
}
function closeImportModal() { const modal = document.getElementById('import-modal'); if (modal) modal.remove(); }

function exportTXTSimple() {
  const sess = currentSession();
  if (!sess.list.length) return toast('La liste est vide', 'error');
  const lines = [];
  const sep = '─'.repeat(32);
  lines.push(`🛒  ${sess.name}`);
  lines.push(sep);
  _buildProductionsBlock(sess, lines);
  // Grouper par rayon uniquement
  const grouped = {};
  sess.list.forEach(item => {
    if (!grouped[item.cat]) grouped[item.cat] = [];
    const existing = grouped[item.cat].find(i => i.name === item.name && i.unit === item.unit);
    if (existing) { existing.qty += item.qty; }
    else grouped[item.cat].push({ name: item.name, qty: item.qty, unit: item.unit, done: item.done });
  });
  const ordered = state.categoryOrder.filter(c => grouped[c]).concat(Object.keys(grouped).filter(c => !state.categoryOrder.includes(c)));
  ordered.forEach(cat => {
    if (!grouped[cat]) return;
    lines.push('');
    lines.push(`  ${cat.toUpperCase()}`);
    grouped[cat].forEach(item => {
      const conv = convertToKgAndCeil(item.qty, item.unit);
      const qtyStr = conv.isInteger ? String(Math.ceil(conv.value)) : conv.value.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
      const check = item.done ? '✓ ' : '☐ ';
      lines.push(`    ${check}${item.name} : ${qtyStr} ${conv.unit}`);
    });
  });
  lines.push(''); lines.push(sep);
  navigator.clipboard.writeText(lines.join('\n'))
    .then(() => toast('Liste simple copiée ✓'))
    .catch(() => toast('Erreur lors de la copie', 'error'));
}

function exportTXTByShop() {
  const sess = currentSession();
  if (!sess.list.length) return toast('La liste est vide', 'error');
  const lines = [];
  const sep = '─'.repeat(32);
  lines.push(`🛒  ${sess.name}`);
  lines.push(sep);
  _buildProductionsBlock(sess, lines);
  // Regrouper par magasin
  const shopMap = {};
  const noShop = [];
  sess.list.forEach(item => {
    const ingInfo = state.recipes.flatMap(r => r.ingredients).find(i => i.name === item.name && i.unit === item.unit);
    const shop = (ingInfo?.shop || item.shop || '').trim();
    const entry = { name: item.name, qty: item.qty, unit: item.unit, done: item.done };
    if (shop) {
      if (!shopMap[shop]) shopMap[shop] = [];
      const existing = shopMap[shop].find(i => i.name === item.name && i.unit === item.unit);
      if (existing) existing.qty += item.qty;
      else shopMap[shop].push(entry);
    } else {
      const existing = noShop.find(i => i.name === item.name && i.unit === item.unit);
      if (existing) existing.qty += item.qty;
      else noShop.push(entry);
    }
  });
  const allShops = Object.keys(shopMap).sort();
  allShops.forEach(shop => {
    lines.push('');
    lines.push(`🏬  ${shop.toUpperCase()}`);
    shopMap[shop].forEach(item => {
      const conv = convertToKgAndCeil(item.qty, item.unit);
      const qtyStr = conv.isInteger ? String(Math.ceil(conv.value)) : conv.value.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
      const check = item.done ? '✓ ' : '☐ ';
      lines.push(`    ${check}${item.name} : ${qtyStr} ${conv.unit}`);
    });
  });
  if (noShop.length) {
    lines.push('');
    lines.push(`❓  SANS MAGASIN`);
    noShop.forEach(item => {
      const conv = convertToKgAndCeil(item.qty, item.unit);
      const qtyStr = conv.isInteger ? String(Math.ceil(conv.value)) : conv.value.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
      const check = item.done ? '✓ ' : '☐ ';
      lines.push(`    ${check}${item.name} : ${qtyStr} ${conv.unit}`);
    });
  }
  lines.push(''); lines.push(sep);
  navigator.clipboard.writeText(lines.join('\n'))
    .then(() => toast('Liste par magasin copiée ✓'))
    .catch(() => toast('Erreur lors de la copie', 'error'));
}

function showListImportModal(data, list) {

  const itemCount = list.length;

  const doneNote = doneCount > 0 ? ` · <span style="color:var(--color-secondary)">${doneCount} déjà coché${doneCount>1?'s':''}</span>` : '';

  const titleText = isShared ? 'Liste partagée' : 'Importer une liste';
  const modal = document.createElement('div'); modal.className = 'modal-overlay'; modal.id = 'list-import-modal';
  modal.innerHTML = `<div class="modal-sheet"><div class="modal-handle"></div><div class="modal-title"><i class="fa-solid ${iconClass}" style="color:var(--color-primary);margin-right:8px;"></i>${titleText}</div><div class="modal-sub">Source : <strong>${sourceName}</strong> · ${itemCount} article${itemCount>1?'s':''}${doneNote}<br>Comment fusionner avec la liste actuelle ?</div>${hasExisting ? `<div style="display:flex;flex-direction:column;gap:10px;"><label style="display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border-color);border-radius:14px;padding:14px 16px;cursor:pointer;"><input type="radio" name="import-mode" value="merge" checked style="width:20px;height:20px;accent-color:var(--color-accent);"><div><div style="font-weight:700;font-size:0.9rem; color:var(--text-main)">Fusionner</div><div style="font-size:0.72rem;color:var(--color-secondary);margin-top:4px;">Additionne les quantités identiques, ajoute les nouveaux articles</div></div></label><label style="display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border-color);border-radius:14px;padding:14px 16px;cursor:pointer;"><input type="radio" name="import-mode" value="replace" style="width:20px;height:20px;accent-color:var(--color-accent);"><div><div style="font-weight:700;font-size:0.9rem; color:var(--text-main)">Remplacer</div><div style="font-size:0.72rem;color:var(--color-secondary);margin-top:4px;">Vide la liste actuelle et importe ce fichier (articles cochés conservés)</div></div></label></div>` : `<div style="background:rgba(10,36,114,0.08);border:1px solid rgba(10,36,114,0.2);border-radius:14px;padding:14px 16px;font-size:0.85rem;color:var(--color-primary);">La liste est vide — les articles seront simplement ajoutés.</div>`}<div class="modal-actions"><button class="btn btn-neutral" onclick="closeListImportModal()">Annuler</button><button class="btn btn-primary" id="confirm-list-import-btn"><i class="fa-solid fa-check"></i> Importer</button></div></div>`;
  modal.addEventListener('click', e => { if (e.target === modal) closeListImportModal(); });
  document.body.appendChild(modal);
  document.getElementById('confirm-list-import-btn').onclick = () => confirmListImport(data, list);
}

function confirmListImport(data, list) {
  const mode = document.querySelector('input[name="import-mode"]:checked')?.value || 'merge';
  const sess = currentSession();
  if (mode === 'replace') {
    sess.list = list.map(i => ({ ...i, done: i.done === true }));
    sess.recipes = data.recipes || {}; sess.singles = data.singles || 0; sess.totalCost = data.totalCost || 0;
    // Restaure les fiches produit si présentes
    if (data.recipeCatalog && Array.isArray(data.recipeCatalog)) {
      const parsed = parseImportedRecipes({ recipes: data.recipeCatalog });
      parsed.forEach(r => {
        const exists = state.recipes.findIndex(x => x.name.toLowerCase() === r.name.toLowerCase());
        if (exists >= 0) state.recipes[exists] = { ...r, id: state.recipes[exists].id };
        else state.recipes.push(r);
      });
    }
    toast(`${list.length} articles importés ✓`);
  } else {
    let added = 0, merged = 0;
    list.forEach(item => {
      const exist = sess.list.find(i => i.name.toLowerCase() === item.name.toLowerCase() && i.unit === item.unit);
      if (exist) { exist.qty = parseFloat((exist.qty + item.qty).toFixed(4)); exist.done = exist.done && (item.done === true); merged++; }
      else { sess.list.push({ ...item, done: item.done === true }); added++; }
    });
    if (data.recipes) { for (const [n, q] of Object.entries(data.recipes)) sess.recipes[n] = (sess.recipes[n] || 0) + q; }
    sess.totalCost = (sess.totalCost || 0) + (data.totalCost || 0);
    // Fusionne aussi les fiches produit
    if (data.recipeCatalog && Array.isArray(data.recipeCatalog)) {
      const parsed = parseImportedRecipes({ recipes: data.recipeCatalog });
      parsed.forEach(r => {
        if (!state.recipes.find(x => x.name.toLowerCase() === r.name.toLowerCase())) state.recipes.push(r);
      });
    }
    const parts = []; if (added) parts.push(`${added} ajouté${added>1?'s':''}`); if (merged) parts.push(`${merged} fusionné${merged>1?'s':''}`);
    toast(parts.join(', ') + ' ✓');
  }
  closeListImportModal(); saveState();
}
function closeListImportModal() { const m = document.getElementById('list-import-modal'); if (m) m.remove(); }

/* ---------- partage via URL ---------- */
function shareListURL() {
  const sess = currentSession();
  if (!sess.list.length) return toast('La liste est vide', 'error');
  const exportData = {
    _type: 'ovni_liste',
    name: sess.name,
    exportedAt: new Date().toISOString(),
    recipes: sess.recipes,
    singles: sess.singles,
    totalCost: sess.totalCost,
    list: sess.list
  };
  try {
    const json = JSON.stringify(exportData);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    const url = window.location.href.split('?')[0].split('#')[0] + '?liste=' + b64;
    if (navigator.share) {
      navigator.share({ title: `Liste : ${sess.name}`, url }).then(() => toast('Lien partagé ✓')).catch(() => copyURL(url));
    } else {
      copyURL(url);
    }
  } catch(e) { toast('Erreur lors de la génération du lien', 'error'); }
}

function copyURL(url) {
  navigator.clipboard.writeText(url).then(() => {
    toast('Lien copié dans le presse-papier ✓');
  }).catch(() => {
    // Fallback : prompt pour copie manuelle
    prompt('Copie ce lien pour partager la liste :', url);
  });
}

function loadSharedList() {
  try {
    const params = new URLSearchParams(window.location.search);
    const b64 = params.get('liste');
    if (!b64) return;
    const json = decodeURIComponent(escape(atob(b64)));
    const data = JSON.parse(json);
    const list = data.list;
    if (!list || !Array.isArray(list)) return;
    // Nettoie l'URL pour éviter de re-charger au refresh
    const cleanUrl = window.location.href.split('?')[0];
    window.history.replaceState({}, '', cleanUrl);
    // Marque comme provenant d'un partage URL
    data._sharedViaURL = true;
    // Montre un modal de confirmation
    showListImportModal(data, list);
  } catch(e) { /* pas de liste dans l'URL, on ignore */ }
}


function init() {
  loadState();
  // Synchronise le DOM avec state.view (le HTML hard-code sec-prod comme actif)
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const activeSec = document.getElementById('sec-' + state.view);
  if (activeSec) activeSec.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const activeNav = document.getElementById('nav-' + state.view);
  if (activeNav) activeNav.classList.add('active');
  document.getElementById('shopping-tabs').style.display = state.view === 'list' ? 'flex' : 'none';
  // Essaie de charger une liste depuis l'URL (partage)
  loadSharedList();
  cancelEdit();
  render();
  // Prévient le parent (index.html) que la page est prête
  try { window.parent.postMessage('etape_suivante', '*'); } catch(e) {}
}

// Lance init après que le DOM soit prêt
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
